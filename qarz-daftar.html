<style>
/* ============ Qarz Daftar — Game Club UI ============ */
:root{
  --bg:#0b0f1a; --bg2:#0f1524; --panel:#131b2e; --panel2:#172136;
  --line:#22304d; --line2:#2c3c5e;
  --tx:#e8eefc; --tx2:#9fb0d0; --tx3:#6b7d9e;
  --acc:#6d5cff; --acc2:#22d3ee;
  --ok:#22c55e; --warn:#f59e0b; --dan:#ef4444; --info:#3b82f6;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  --r:14px; --r2:10px;
  --sidebar:252px;
}
html[data-theme="light"]{
  --bg:#eef2f9; --bg2:#f6f8fc; --panel:#ffffff; --panel2:#f4f7fd;
  --line:#dde5f2; --line2:#c9d5ea;
  --tx:#101a2e; --tx2:#4b5c78; --tx3:#7a8aa6;
  --shadow:0 8px 24px rgba(20,40,80,.10);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--tx);
  font:14px/1.45 "Segoe UI",Inter,Roboto,system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- Layout ---------- */
.app{display:flex;min-height:100vh}
.sidebar{
  width:var(--sidebar);flex:0 0 var(--sidebar);background:linear-gradient(180deg,var(--bg2),var(--panel));
  border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:60;
}
.brand{display:flex;align-items:center;gap:10px;padding:16px 14px;border-bottom:1px solid var(--line)}
.brand-logo{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:20px;
  background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 6px 18px rgba(109,92,255,.4)}
.brand-name{font-weight:800;letter-spacing:.5px;font-size:14px}
.brand-sub{font-size:11px;color:var(--tx3)}
.sidebar .sidebar-close{display:none;margin-left:auto}
.nav{padding:10px 8px;overflow:auto;flex:1}
.nav-group{font-size:10.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--tx3);margin:14px 10px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:var(--r2);color:var(--tx2);
  font-weight:600;font-size:13px;margin-bottom:2px;transition:.14s}
.nav-item .ni{width:20px;text-align:center;font-size:15px}
.nav-item:hover{background:var(--panel2);color:var(--tx)}
.nav-item.active{background:linear-gradient(90deg,rgba(109,92,255,.22),rgba(34,211,238,.08));color:#fff;
  box-shadow:inset 2px 0 0 var(--acc)}
html[data-theme="light"] .nav-item.active{color:var(--acc)}
.nav-badge{margin-left:auto;background:var(--dan);color:#fff;border-radius:20px;padding:1px 7px;font-size:11px;font-weight:700}
.nav-badge:empty{display:none}
.nav-badge.warn{background:var(--warn);color:#231a00}
.sidebar-foot{padding:10px;border-top:1px solid var(--line)}
.backup-chip{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:8px 10px;font-size:11.5px;color:var(--tx2);cursor:pointer}
.backup-chip .dot{width:8px;height:8px;border-radius:50%;background:var(--tx3);flex:0 0 8px}
.backup-chip .dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.backup-chip .dot.err{background:var(--dan);box-shadow:0 0 8px var(--dan)}
.backup-chip .dot.warn{background:var(--warn)}
.version{text-align:center;font-size:10px;color:var(--tx3);margin-top:8px}
.sidebar-overlay{display:none}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:10px 16px;
  background:rgba(11,15,26,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
html[data-theme="light"] .topbar{background:rgba(255,255,255,.86)}
.search-wrap{position:relative;flex:1;max-width:620px}
.search{width:100%;padding:9px 12px 9px 34px;border-radius:11px;background:var(--panel);border:1px solid var(--line);outline:none}
.search:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(109,92,255,.16)}
.search-ico{position:absolute;left:11px;top:9px;opacity:.6}
.search-results{position:absolute;top:46px;left:0;right:0;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--shadow);max-height:70vh;overflow:auto;z-index:70;padding:6px}
.sr-group{font-size:10.5px;text-transform:uppercase;color:var(--tx3);padding:8px 10px 4px;letter-spacing:1px}
.sr-item{padding:8px 10px;border-radius:9px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.sr-item:hover{background:var(--panel2)}
.topbar-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.cashier-chip{display:flex;align-items:center;gap:8px;padding:5px 10px 5px 5px;border-radius:30px;background:var(--panel);
  border:1px solid var(--line);cursor:pointer;font-size:12.5px;font-weight:600}
.cashier-chip .ava{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;
  background:linear-gradient(135deg,var(--acc),var(--acc2))}
.view{padding:18px;flex:1}
.loading{padding:40px;text-align:center;color:var(--tx3)}

/* ---------- Buttons / controls ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel);cursor:pointer;font-weight:600;font-size:13px;transition:.14s;white-space:nowrap}
.btn:hover{border-color:var(--line2);transform:translateY(-1px)}
.btn:active{transform:none}
.btn-primary{background:linear-gradient(135deg,var(--acc),#8b7bff);border-color:transparent;color:#fff}
.btn-success{background:linear-gradient(135deg,#16a34a,#22c55e);border-color:transparent;color:#fff}
.btn-danger{background:linear-gradient(135deg,#dc2626,#ef4444);border-color:transparent;color:#fff}
.btn-warn{background:linear-gradient(135deg,#d97706,#f59e0b);border-color:transparent;color:#231a00}
.btn-ghost{background:transparent}
.btn-sm{padding:5px 9px;font-size:12px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);
  cursor:pointer;display:grid;place-items:center;font-size:15px}
.icon-btn:hover{border-color:var(--line2)}
.only-mobile{display:none}

.input,.select,textarea.input{width:100%;padding:9px 11px;border-radius:10px;background:var(--panel2);
  border:1px solid var(--line);outline:none}
.input:focus,.select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(109,92,255,.15)}
.input.money{font-weight:700;letter-spacing:.5px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--tx2);margin-bottom:5px;font-weight:600}
.field .hint{font-size:11px;color:var(--tx3);margin-top:4px}
.field .err{font-size:11.5px;color:var(--dan);margin-top:4px;display:none}
.field.invalid .err{display:block}
.field.invalid .input,.field.invalid .select{border-color:var(--dan)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}

/* ---------- Cards ---------- */
.page-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-title{font-size:20px;font-weight:800;letter-spacing:.3px}
.page-sub{font-size:12.5px;color:var(--tx3)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;position:relative;overflow:hidden}
.card.stat .lab{font-size:12px;color:var(--tx2);display:flex;align-items:center;gap:7px;font-weight:600}
.card.stat .val{font-size:22px;font-weight:800;margin-top:8px;letter-spacing:.2px}
.card.stat .sub{font-size:11.5px;color:var(--tx3);margin-top:5px}
.card.stat::after{content:"";position:absolute;inset:auto -30px -40px auto;width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle,rgba(109,92,255,.18),transparent 70%)}
.card.ok .val{color:var(--ok)} .card.dan .val{color:var(--dan)} .card.warn .val{color:var(--warn)} .card.info .val{color:var(--acc2)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px}
.panel-head{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-title{font-weight:700;font-size:14px}
.panel-body{padding:15px}
.panel-body.tight{padding:0}

/* ---------- Table ---------- */
.table-wrap{overflow:auto;max-width:100%}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{position:sticky;top:0;background:var(--panel2);text-align:left;padding:10px 12px;font-size:11.5px;
  text-transform:uppercase;letter-spacing:.6px;color:var(--tx3);border-bottom:1px solid var(--line);white-space:nowrap;z-index:2}
table.tbl th.sortable{cursor:pointer;user-select:none}
table.tbl th.sortable:hover{color:var(--tx)}
table.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tbl tbody tr:hover{background:var(--panel2)}
table.tbl tbody tr.clickable{cursor:pointer}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-variant-numeric:tabular-nums}
.muted{color:var(--tx3)}
.strong{font-weight:700}
.empty{padding:36px;text-align:center;color:var(--tx3)}
.empty .big{font-size:32px;margin-bottom:8px}
.pager{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;
  border:1px solid transparent;white-space:nowrap}
.b-green{background:rgba(34,197,94,.14);color:#4ade80;border-color:rgba(34,197,94,.3)}
.b-yellow{background:rgba(245,158,11,.14);color:#fbbf24;border-color:rgba(245,158,11,.3)}
.b-red{background:rgba(239,68,68,.14);color:#f87171;border-color:rgba(239,68,68,.3)}
.b-blue{background:rgba(59,130,246,.14);color:#60a5fa;border-color:rgba(59,130,246,.3)}
.b-gray{background:var(--panel2);color:var(--tx2);border-color:var(--line)}
html[data-theme="light"] .b-green{color:#15803d} html[data-theme="light"] .b-yellow{color:#b45309}
html[data-theme="light"] .b-red{color:#b91c1c} html[data-theme="light"] .b-blue{color:#1d4ed8}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 11px;border-radius:20px;border:1px solid var(--line);background:var(--panel);cursor:pointer;
  font-size:12px;font-weight:600;color:var(--tx2)}
.chip:hover{border-color:var(--line2)}
.chip.active{background:linear-gradient(135deg,var(--acc),#8b7bff);color:#fff;border-color:transparent}

/* ---------- Modal ---------- */
.modal-root{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:rgba(3,6,14,.6);
  backdrop-filter:blur(4px);padding:16px;overflow:auto}
.modal-root[hidden]{display:none}   /* hidden atributi CSS display'dan kuchsiz — aniq bekor qilamiz */
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:16px;box-shadow:var(--shadow);
  width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;animation:pop .16s ease-out}
.modal.wide{max-width:920px}
.modal.xwide{max-width:1150px}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.modal-title{font-weight:800;font-size:15px}
.modal-body{padding:16px;overflow:auto}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:13px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.confirm-text{font-size:14px;line-height:1.6}

/* ---------- Toast ---------- */
.toast-root{position:fixed;right:16px;bottom:16px;z-index:300;display:flex;flex-direction:column;gap:8px;max-width:360px}
.toast{background:var(--panel);border:1px solid var(--line2);border-left:4px solid var(--acc);border-radius:11px;
  padding:11px 14px;box-shadow:var(--shadow);font-size:13px;animation:slide .2s}
.toast.ok{border-left-color:var(--ok)} .toast.err{border-left-color:var(--dan)} .toast.warn{border-left-color:var(--warn)}
@keyframes slide{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}

/* ---------- POS ---------- */
.pos{display:grid;grid-template-columns:1fr 380px;gap:14px;align-items:start}
.pos-products{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:14px;max-height:66vh;overflow:auto}
.p-card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px;cursor:pointer;transition:.13s}
.p-card:hover{border-color:var(--acc);transform:translateY(-2px)}
.p-card.out{opacity:.45;cursor:not-allowed}
.p-card .pn{font-weight:700;font-size:13px;margin-bottom:6px;min-height:34px}
.p-card .pp{color:var(--acc2);font-weight:800}
.p-card .ps{font-size:11px;color:var(--tx3);margin-top:4px}
.cart-item{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.cart-item .ci-n{flex:1;min-width:0;font-size:12.5px;font-weight:600;word-break:break-word}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font-weight:800}
.qty input{width:44px;text-align:center;border-radius:7px;border:1px solid var(--line);background:var(--panel2);padding:4px}
.cart-total{display:flex;justify-content:space-between;padding:8px 0;font-size:13px}
.cart-total.big{font-size:19px;font-weight:800;border-top:1px solid var(--line2);margin-top:6px;padding-top:12px}

/* ---------- Charts ---------- */
.chart{width:100%;height:230px}
.chart-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--tx2);padding:0 15px 12px}
.chart-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.bar-row .bl{width:130px;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;height:9px;background:var(--panel2);border-radius:20px;overflow:hidden}
.bar-fill{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.bar-row .bv{width:130px;text-align:right;font-size:12.5px;font-weight:700}
.rank{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:800;background:var(--panel2)}
.rank.r1{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#231a00}
.rank.r2{background:linear-gradient(135deg,#94a3b8,#cbd5e1);color:#0b1220}
.rank.r3{background:linear-gradient(135deg,#b45309,#d97706);color:#fff}

/* ---------- Timeline ---------- */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tl-item{position:relative;padding:7px 0}
.tl-item::before{content:"";position:absolute;left:-20px;top:13px;width:10px;height:10px;border-radius:50%;
  background:var(--acc);border:2px solid var(--panel)}
.tl-item.debt::before{background:var(--dan)} .tl-item.pay::before{background:var(--ok)}
.tl-t{font-size:11px;color:var(--tx3)} .tl-d{font-size:13px}

/* ---------- Receipt ---------- */
.receipt{font-family:"Consolas","Courier New",monospace;background:#fff;color:#000;padding:14px;width:302px;margin:0 auto;font-size:12px}
.receipt .rc{text-align:center} .receipt hr{border:none;border-top:1px dashed #000;margin:7px 0}
.receipt .rl{display:flex;justify-content:space-between}
.receipt .big{font-size:15px;font-weight:800}
.print-area{display:none}

/* ---------- Misc ---------- */
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--tx2)}
.kv .v{font-weight:700}
.avatar{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;color:#fff;
  background:linear-gradient(135deg,var(--acc),var(--acc2));flex:0 0 34px}
.cust-cell{display:flex;align-items:center;gap:9px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 15px;overflow:auto}
.tab{padding:11px 13px;font-size:13px;font-weight:600;color:var(--tx2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:var(--tx);border-bottom-color:var(--acc)}
.switch{position:relative;display:inline-block;width:44px;height:24px;flex:0 0 44px;vertical-align:middle}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:var(--line2);border-radius:30px;cursor:pointer;transition:.2s}
.slider::before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked + .slider{background:var(--ok)}
.switch input:checked + .slider::before{transform:translateX(20px)}
.hl{background:rgba(109,92,255,.25);border-radius:3px}

@media print{
  body *{visibility:hidden}
  .print-area,.print-area *{visibility:visible;display:block}
  .print-area{position:absolute;left:0;top:0;width:100%}
  .receipt{width:100%;max-width:302px}
}
@media (max-width:1100px){ .pos{grid-template-columns:1fr} }
@media (max-width:880px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:.22s}
  body.nav-open .sidebar{transform:none}
  body.nav-open .sidebar-overlay{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:55}

<script>
/* =========================================================================
   Qarz Daftar — CORE
   Ma'lumotlar bazasi, hisob-kitob mantig'i, formatlash, validatsiya.
   Barcha summalar butun son (integer) — UZS so'm. Floating point ishlatilmaydi.
   ========================================================================= */
(function () {
  'use strict';

  const GC = window.GC = window.GC || {};
  const DB_KEY = 'qarz_daftar_db_v1';
  const SCHEMA = 1;

  /* ------------------------- Formatlash ------------------------- */
  const MONTHS = ['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentabr','Oktabr','Noyabr','Dekabr'];
  const WEEK = ['Yakshanba','Dushanba','Seshanba','Chorshanba','Payshanba','Juma','Shanba'];

  function groupNum(n) {
    const neg = n < 0;
    let s = String(Math.abs(Math.round(n)));
    s = s.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    return (neg ? '-' : '') + s;
  }
  const money = (n) => groupNum(n || 0) + ' so‘m';
  const moneyShort = (n) => {
    n = n || 0;
    const a = Math.abs(n);
    if (a >= 1e9) return (n / 1e9).toFixed(1).replace('.0','') + ' mlrd';
    if (a >= 1e6) return (n / 1e6).toFixed(1).replace('.0','') + ' mln';
    if (a >= 1e3) return groupNum(n);
    return groupNum(n);
  };
  function parseMoney(v) {
    if (typeof v === 'number') return Math.round(v);
    const s = String(v == null ? '' : v).replace(/[^\d-]/g, '');
    if (!s || s === '-') return NaN;
    return parseInt(s, 10);
  }
  const pad2 = (n) => (n < 10 ? '0' : '') + n;

  function todayISO() { return dateToISO(new Date()); }
  function dateToISO(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function isoToDate(iso) {
    if (!iso) return null;
    const p = String(iso).slice(0, 10).split('-');
    if (p.length !== 3) return null;
    const d = new Date(+p[0], +p[1] - 1, +p[2]);
    return isNaN(d.getTime()) ? null : d;
  }
  function fmtDate(iso) {
    const d = isoToDate(iso); if (!d) return '—';
    return pad2(d.getDate()) + '.' + pad2(d.getMonth() + 1) + '.' + d.getFullYear();
  }
  function fmtDT(ts) {
    if (!ts) return '—';
    const d = new Date(ts); if (isNaN(d.getTime())) return '—';
    return pad2(d.getDate()) + '.' + pad2(d.getMonth() + 1) + '.' + d.getFullYear() + ' ' +
           pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
  }
  function fmtTime(ts) {
    const d = new Date(ts); if (isNaN(d.getTime())) return '—';
    return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }
  function daysDiff(isoA, isoB) { // isoA - isoB (kunlarda)
    const a = isoToDate(isoA), b = isoToDate(isoB);
    if (!a || !b) return 0;
    return Math.round((a - b) / 86400000);
  }
  function addDays(iso, n) {
    const d = isoToDate(iso) || new Date();
    d.setDate(d.getDate() + n);
    return dateToISO(d);
  }
  function fmtSize(bytes) {
    if (!bytes && bytes !== 0) return '—';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1048576).toFixed(2) + ' MB';
  }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function uid(prefix) {
    return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }
  function normPhone(p) { return String(p || '').replace(/[^\d+]/g, ''); }
  function fmtPhone(p) {
    const d = String(p || '').replace(/\D/g, '');
    if (d.length === 12 && d.startsWith('998'))
      return '+998 ' + d.slice(3, 5) + ' ' + d.slice(5, 8) + ' ' + d.slice(8, 10) + ' ' + d.slice(10);
    if (d.length === 9) return '+998 ' + d.slice(0, 2) + ' ' + d.slice(2, 5) + ' ' + d.slice(5, 7) + ' ' + d.slice(7);
    return p || '—';
  }
  function validPhone(p) {
    const d = String(p || '').replace(/\D/g, '');
    return d.length >= 7 && d.length <= 15;
  }

  /* ------------------------- Boshlang'ich baza ------------------------- */
  function defaultState() {
    const t = todayISO();
    return {
      schema: SCHEMA,
      settings: {
        clubName: 'GAME CLUB',
        address: '',
        phone: '',
        cashier: 'Admin',
        cashiers: ['Admin'],
        theme: 'dark',
        autoBackup: true,
        backupDebounceMs: 1500,
        allowNegativeStock: false,
        defaultDueDays: 7,
        receiptFooter: 'Xaridingiz uchun rahmat!',
        createdAt: t
      },
      customers: [],
      debts: [],
      payments: [],
      categories: [
        { id: 'cat_drink', name: 'Ichimliklar' },
        { id: 'cat_chips', name: 'Chips' },
        { id: 'cat_sweet', name: 'Shirinliklar' },
        { id: 'cat_food', name: 'Fast Food' },
        { id: 'cat_acc', name: 'Aksessuarlar' },
        { id: 'cat_game', name: 'Gaming mahsulotlar' },
        { id: 'cat_other', name: 'Boshqa' }
      ],
      suppliers: [],
      products: [],
      stock_movements: [],
      purchases: [],
      purchase_items: [],
      sales: [],
      sale_items: [],
      inventory_adjustments: [],
      audit_logs: [],
      backup_logs: []
    };
  }

  const UNITS = ['dona', 'litr', 'kg', 'quti', 'pachka', 'metr', 'boshqa'];
  const PAY_METHODS = [
    { id: 'naqd', name: 'Naqd' }, { id: 'karta', name: 'Karta' }, { id: 'click', name: 'Click' },
    { id: 'payme', name: 'Payme' }, { id: 'uzum', name: 'Uzum' }, { id: 'boshqa', name: 'Boshqa' }
  ];
  const SALE_METHODS = PAY_METHODS.concat([{ id: 'qarz', name: 'Qarz' }]);

  /* ------------------------- Saqlash ------------------------- */
  let S = defaultState();
  let saveTimer = null;
  let cache = null;

  function migrate(data) {
    const base = defaultState();
    const out = Object.assign({}, base, data || {});
    out.settings = Object.assign({}, base.settings, (data && data.settings) || {});
    // massiv maydonlar mavjudligini kafolatlash
    Object.keys(base).forEach(k => {
      if (Array.isArray(base[k]) && !Array.isArray(out[k])) out[k] = base[k].slice();
    });
    out.schema = SCHEMA;
    return out;
  }

  function load() {
    try {
      const raw = localStorage.getItem(DB_KEY);
      if (raw) { S = migrate(JSON.parse(raw)); return true; }
    } catch (e) { console.error('DB o‘qishda xato', e); }
    S = defaultState();
    return false;
  }

  function persist() {
    try {
      localStorage.setItem(DB_KEY, JSON.stringify(S));
      return true;
    } catch (e) {
      console.error(e);
      GC.toast('Ma’lumotni saqlab bo‘lmadi: xotira to‘lgan bo‘lishi mumkin', 'err');
      return false;
    }
  }

  function save(opts) {
    cache = null;
    persist();
    if (!opts || opts.backup !== false) GC.Backup && GC.Backup.schedule();
    if (!opts || opts.render !== false) GC.rerender && GC.rerender();
  }

  /* ------------------------- Audit ------------------------- */
  function audit(action, entity, entityId, description, extra) {
    S.audit_logs.push({
      id: uid('log'), ts: Date.now(), action, entity, entityId,
      description, user: S.settings.cashier, extra: extra || null
    });
    if (S.audit_logs.length > 20000) S.audit_logs.splice(0, S.audit_logs.length - 20000);
  }

  /* ------------------------- Hisob-kitob (derived) ------------------------- */
  /* Hech qachon qo'lda saqlangan balans ishlatilmaydi — har doim bazadan hisoblanadi. */
  function compute() {
    if (cache) return cache;
    const today = todayISO();
    const debts = S.debts.filter(d => !d.canceled);
    const payments = S.payments.filter(p => !p.canceled);

    const debtById = new Map();
    const perCustomerDebts = new Map();
    debts.forEach(d => {
      const row = { debt: d, paid: 0 };
      debtById.set(d.id, row);
      if (!perCustomerDebts.has(d.customerId)) perCustomerDebts.set(d.customerId, []);
      perCustomerDebts.get(d.customerId).push(row);
    });
    // eng eski qarz birinchi (FIFO)
    perCustomerDebts.forEach(list => list.sort((a, b) =>
      (a.debt.date === b.debt.date ? (a.debt.createdAt || 0) - (b.debt.createdAt || 0) : (a.debt.date < b.debt.date ? -1 : 1))));

    const perCustomerPaid = new Map();
    const lastPayMap = new Map();
    const free = new Map(); // customerId -> taqsimlanmagan to'lov

    payments.forEach(p => {
      perCustomerPaid.set(p.customerId, (perCustomerPaid.get(p.customerId) || 0) + p.amount);
      const lp = lastPayMap.get(p.customerId);
      if (!lp || p.date > lp) lastPayMap.set(p.customerId, p.date);
      let rest = p.amount;
      if (p.debtId && debtById.has(p.debtId)) {
        const row = debtById.get(p.debtId);
        const can = Math.max(0, row.debt.amount - row.paid);
        const use = Math.min(can, rest);
        row.paid += use; rest -= use;
      }
      if (rest > 0) free.set(p.customerId, (free.get(p.customerId) || 0) + rest);
    });
    // qolgan to'lovlarni eng eski qarzlardan boshlab taqsimlash
    free.forEach((amount, cid) => {
      const list = perCustomerDebts.get(cid) || [];
      let rest = amount;
      for (let i = 0; i < list.length && rest > 0; i++) {
        const row = list[i];
        const can = Math.max(0, row.debt.amount - row.paid);
        const use = Math.min(can, rest);
        row.paid += use; rest -= use;
      }
    });

    const customers = S.customers.map(c => {
      const list = perCustomerDebts.get(c.id) || [];
      const total = list.reduce((s, r) => s + r.debt.amount, 0);
      const paid = perCustomerPaid.get(c.id) || 0;
      const remain = Math.max(0, total - paid);
      let lastDebt = null, overdue = 0, dueToday = 0;
      const lastPay = lastPayMap.get(c.id) || null;
      list.forEach(r => {
        if (!lastDebt || r.debt.date > lastDebt) lastDebt = r.debt.date;
        const rem = r.debt.amount - r.paid;
        if (rem > 0 && r.debt.dueDate) {
          const dd = daysDiff(today, r.debt.dueDate);
          if (dd > 0) overdue += rem; else if (dd === 0) dueToday += rem;
        }
      });
      const status = remain <= 0 ? 'clear' : (overdue > 0 ? 'overdue' : 'debt');
      return { id: c.id, c, total, paid, remain, lastDebt, lastPay, overdue, dueToday, status, debtCount: list.length };
    });
    const custById = new Map(customers.map(x => [x.id, x]));

    const debtRows = debts.map(d => {
      const row = debtById.get(d.id);
      const paid = row ? row.paid : 0;
      const remain = Math.max(0, d.amount - paid);
      let status, dueDays = null;
      if (remain <= 0) status = 'paid';
      else {
        if (d.dueDate) {
          dueDays = daysDiff(today, d.dueDate); // musbat = kechikkan kun
          if (dueDays > 0) status = 'overdue';
          else if (dueDays === 0) status = 'due_today';
          else status = paid > 0 ? 'partial' : 'open';
        } else status = paid > 0 ? 'partial' : 'open';
      }
      return { d, paid, remain, status, dueDays, customer: custById.get(d.customerId) };
    });
    const debtRowById = new Map(debtRows.map(r => [r.d.id, r]));

    const totals = {
      debt: debts.reduce((s, d) => s + d.amount, 0),
      paid: payments.reduce((s, p) => s + p.amount, 0)
    };
    totals.remain = Math.max(0, totals.debt - totals.paid);
    totals.todayDebt = debts.filter(d => d.date === today).reduce((s, d) => s + d.amount, 0);
    totals.todayPaid = payments.filter(p => p.date === today).reduce((s, p) => s + p.amount, 0);
    totals.debtorCount = customers.filter(x => x.remain > 0).length;
    totals.clearCount = customers.filter(x => x.remain <= 0 && x.total > 0).length;
    totals.overdue = debtRows.filter(r => r.status === 'overdue').reduce((s, r) => s + r.remain, 0);
    totals.overdueCount = debtRows.filter(r => r.status === 'overdue').length;
    totals.dueToday = debtRows.filter(r => r.status === 'due_today').reduce((s, r) => s + r.remain, 0);
    totals.closedDebts = debtRows.filter(r => r.status === 'paid').length;

    /* ---- Ombor ---- */
    const stockMap = new Map();
    S.products.forEach(p => stockMap.set(p.id, 0));
    S.stock_movements.forEach(m => {
      if (m.canceled) return;
      stockMap.set(m.productId, (stockMap.get(m.productId) || 0) + m.qty);
    });
    const products = S.products.map(p => {
      const qty = stockMap.get(p.id) || 0;
      const st = qty <= 0 ? 'out' : (qty <= (p.minStock || 0) ? 'low' : 'ok');
      return { p, qty, status: st, costValue: qty * p.costPrice, saleValue: qty * p.salePrice };
    });
    const prodById = new Map(products.map(x => [x.p.id, x]));

    const stock = {
      names: products.length,
      units: products.reduce((s, x) => s + x.qty, 0),
      costValue: products.reduce((s, x) => s + Math.max(0, x.costValue), 0),
      saleValue: products.reduce((s, x) => s + Math.max(0, x.saleValue), 0),
      low: products.filter(x => x.status === 'low').length,
      out: products.filter(x => x.status === 'out').length
    };
    stock.potentialProfit = stock.saleValue - stock.costValue;

    /* ---- Sotuv / Kassa ---- */
    const sales = S.sales.filter(s => !s.canceled);
    const todaySales = sales.filter(s => s.date === today);
    const shop = {
      todayTotal: todaySales.reduce((s, x) => s + x.total, 0),
      todayProfit: todaySales.reduce((s, x) => s + (x.total - x.cost), 0),
      todayCount: todaySales.length,
      todayItems: (() => {
        const ids = new Set(todaySales.map(s => s.id));
        return S.sale_items.reduce((s, i) => s + (ids.has(i.saleId) ? i.qty : 0), 0);
      })(),
      totalRevenue: sales.reduce((s, x) => s + x.total, 0),
      totalProfit: sales.reduce((s, x) => s + (x.total - x.cost), 0)
    };
    const todayIn = S.purchases.filter(p => !p.canceled && p.date === today).reduce((s, p) => s + p.total, 0);

    const cashRows = [];
    sales.forEach(s => { if (s.method !== 'qarz') cashRows.push({ date: s.date, amount: s.total, method: s.method, src: 'sotuv', id: s.id }); });
    payments.forEach(p => cashRows.push({ date: p.date, amount: p.amount, method: p.method, src: 'qarz to‘lovi', id: p.id }));
    const cash = {
      total: cashRows.reduce((s, r) => s + r.amount, 0),
      today: cashRows.filter(r => r.date === today).reduce((s, r) => s + r.amount, 0),
      byMethod: {}
    };
    PAY_METHODS.forEach(m => { cash.byMethod[m.id] = cashRows.filter(r => r.method === m.id).reduce((s, r) => s + r.amount, 0); });
    cash.todayByMethod = {};
    PAY_METHODS.forEach(m => { cash.todayByMethod[m.id] = cashRows.filter(r => r.method === m.id && r.date === today).reduce((s, r) => s + r.amount, 0); });

    cache = { today, customers, custById, debtRows, debtRowById, totals, products, prodById, stock, shop, cash, cashRows, todayIn };
    return cache;
  }

  /* ------------------------- CRUD: Mijoz ------------------------- */
  function addCustomer(data) {
    const c = {
      id: uid('cus'), name: String(data.name || '').trim(), phone: normPhone(data.phone),
      telegram: String(data.telegram || '').trim(), note: String(data.note || '').trim(),
      createdAt: Date.now(), date: todayISO()
    };
    S.customers.push(c);
    audit('create', 'customer', c.id, 'Yangi mijoz qo‘shildi: ' + c.name);
    save();
    return c;
  }
  function updateCustomer(id, data) {
    const c = S.customers.find(x => x.id === id); if (!c) return null;
    const before = c.name;
    Object.assign(c, {
      name: String(data.name || '').trim(), phone: normPhone(data.phone),
      telegram: String(data.telegram || '').trim(), note: String(data.note || '').trim()
    });
    audit('update', 'customer', id, 'Mijoz tahrirlandi: ' + before + (before !== c.name ? ' → ' + c.name : ''));
    save();
    return c;
  }
  function deleteCustomer(id) {
    const c = S.customers.find(x => x.id === id); if (!c) return false;
    const hasOps = S.debts.some(d => d.customerId === id) || S.payments.some(p => p.customerId === id);
    if (hasOps) return false;
    S.customers = S.customers.filter(x => x.id !== id);
    audit('delete', 'customer', id, 'Mijoz o‘chirildi: ' + c.name);
    save();
    return true;
  }

  /* ------------------------- CRUD: Qarz ------------------------- */
  function addDebt(data) {
    const d = {
      id: uid('dbt'), customerId: data.customerId, amount: parseMoney(data.amount),
      date: data.date || todayISO(), dueDate: data.dueDate || null,
      reason: String(data.reason || '').trim(), note: String(data.note || '').trim(),
      cashier: data.cashier || S.settings.cashier, saleId: data.saleId || null,
      canceled: false, createdAt: Date.now()
    };
    S.debts.push(d);
    const c = S.customers.find(x => x.id === d.customerId);
    audit('create', 'debt', d.id, (c ? c.name : '?') + ' ga ' + money(d.amount) + ' qarz yozildi' + (d.reason ? ' (' + d.reason + ')' : ''));
    if (!data._silent) save();
    return d;
  }
  function updateDebt(id, data) {
    const d = S.debts.find(x => x.id === id); if (!d) return null;
    const old = { amount: d.amount, dueDate: d.dueDate, date: d.date, reason: d.reason };
    d.amount = parseMoney(data.amount);
    d.date = data.date || d.date;
    d.dueDate = data.dueDate || null;
    d.reason = String(data.reason || '').trim();
    d.note = String(data.note || '').trim();
    audit('update', 'debt', id, 'Qarz tahrirlandi: ' + money(old.amount) + ' → ' + money(d.amount), old);
    save();
    return d;
  }
  function cancelDebt(id, reason) {
    const d = S.debts.find(x => x.id === id); if (!d) return false;
    d.canceled = true; d.canceledAt = Date.now(); d.cancelReason = reason || '';
    audit('cancel', 'debt', id, 'Qarz bekor qilindi: ' + money(d.amount) + (reason ? ' — ' + reason : ''));
    save();
    return true;
  }
  function deleteDebt(id, reason) {
    const d = S.debts.find(x => x.id === id); if (!d) return false;
    const snap = JSON.parse(JSON.stringify(d));
    S.debts = S.debts.filter(x => x.id !== id);
    S.payments.forEach(p => { if (p.debtId === id) p.debtId = null; });
    audit('delete', 'debt', id, 'Qarz o‘chirildi: ' + money(d.amount) + (reason ? ' — ' + reason : ''), snap);
    save();
    return true;
  }

  /* ------------------------- CRUD: To'lov ------------------------- */
  function addPayment(data) {
    const p = {
      id: uid('pay'), customerId: data.customerId, debtId: data.debtId || null,
      amount: parseMoney(data.amount), date: data.date || todayISO(),
      method: data.method || 'naqd', note: String(data.note || '').trim(),
      cashier: data.cashier || S.settings.cashier, canceled: false, createdAt: Date.now()
    };
    S.payments.push(p);
    const c = S.customers.find(x => x.id === p.customerId);
    audit('create', 'payment', p.id, (c ? c.name : '?') + ' ' + money(p.amount) + ' to‘ladi (' + methodName(p.method) + ')');
    save();
    cache = null;
    const st = compute().custById.get(p.customerId);
    if (st) audit('info', 'payment', p.id, 'Qolgan qarz: ' + money(st.remain));
    persist();
    return p;
  }
  function updatePayment(id, data) {
    const p = S.payments.find(x => x.id === id); if (!p) return null;
    const old = p.amount;
    p.amount = parseMoney(data.amount);
    p.date = data.date || p.date;
    p.method = data.method || p.method;
    p.debtId = data.debtId || null;
    p.note = String(data.note || '').trim();
    audit('update', 'payment', id, 'To‘lov tahrirlandi: ' + money(old) + ' → ' + money(p.amount), { amount: old });
    save();
    return p;
  }
  function deletePayment(id, reason) {
    const p = S.payments.find(x => x.id === id); if (!p) return false;
    const snap = JSON.parse(JSON.stringify(p));
    S.payments = S.payments.filter(x => x.id !== id);
    audit('delete', 'payment', id, 'To‘lov o‘chirildi: ' + money(p.amount) + (reason ? ' — ' + reason : ''), snap);
    save();
    return true;
  }

  function methodName(id) {
    const m = SALE_METHODS.find(x => x.id === id);
    return m ? m.name : id;
  }

  /* ------------------------- Mahsulot / Ombor ------------------------- */
  function addProduct(data) {
    const p = {
      id: uid('prd'), name: String(data.name || '').trim(), categoryId: data.categoryId || 'cat_other',
      costPrice: parseMoney(data.costPrice), salePrice: parseMoney(data.salePrice),
      minStock: parseInt(data.minStock, 10) || 0, barcode: String(data.barcode || '').trim(),
      unit: data.unit || 'dona', supplierId: data.supplierId || null,
      note: String(data.note || '').trim(), active: true, createdAt: Date.now()
    };
    S.products.push(p);
    audit('create', 'product', p.id, 'Mahsulot qo‘shildi: ' + p.name);
    const start = parseInt(data.startQty, 10) || 0;
    if (start > 0) {
      S.stock_movements.push({
        id: uid('mov'), productId: p.id, qty: start, type: 'in', refType: 'start', refId: null,
        date: todayISO(), ts: Date.now(), note: 'Boshlang‘ich qoldiq', cashier: S.settings.cashier
      });
      audit('stock', 'product', p.id, p.name + ': boshlang‘ich qoldiq ' + start + ' ' + p.unit);
    }
    save();
    return p;
  }
  function updateProduct(id, data) {
    const p = S.products.find(x => x.id === id); if (!p) return null;
    Object.assign(p, {
      name: String(data.name || '').trim(), categoryId: data.categoryId || p.categoryId,
      costPrice: parseMoney(data.costPrice), salePrice: parseMoney(data.salePrice),
      minStock: parseInt(data.minStock, 10) || 0, barcode: String(data.barcode || '').trim(),
      unit: data.unit || p.unit, supplierId: data.supplierId || null, note: String(data.note || '').trim()
    });
    audit('update', 'product', id, 'Mahsulot tahrirlandi: ' + p.name);
    save();
    return p;
  }
  function deleteProduct(id) {
    const p = S.products.find(x => x.id === id); if (!p) return false;
    const used = S.sale_items.some(i => i.productId === id) || S.purchase_items.some(i => i.productId === id);
    if (used) { p.active = false; audit('archive', 'product', id, 'Mahsulot arxivlandi: ' + p.name); save(); return 'archived'; }
    S.products = S.products.filter(x => x.id !== id);
    S.stock_movements = S.stock_movements.filter(m => m.productId !== id);
    audit('delete', 'product', id, 'Mahsulot o‘chirildi: ' + p.name);
    save();
    return true;
  }

  function addPurchase(data) {
    // data: {supplierId, date, note, items:[{productId, qty, cost}]}
    const items = (data.items || []).filter(i => i.qty > 0);
    if (!items.length) return null;
    const total = items.reduce((s, i) => s + i.qty * i.cost, 0);
    const pur = {
      id: uid('pur'), supplierId: data.supplierId || null, date: data.date || todayISO(),
      total, note: String(data.note || '').trim(), cashier: S.settings.cashier,
      canceled: false, ts: Date.now()
    };
    S.purchases.push(pur);
    items.forEach(i => {
      S.purchase_items.push({ id: uid('pit'), purchaseId: pur.id, productId: i.productId, qty: i.qty, cost: i.cost });
      S.stock_movements.push({
        id: uid('mov'), productId: i.productId, qty: i.qty, type: 'in', refType: 'purchase', refId: pur.id,
        date: pur.date, ts: Date.now(), note: 'Kirim', cashier: S.settings.cashier
      });
      const p = S.products.find(x => x.id === i.productId);
      if (p && data.updateCost !== false && i.cost > 0) p.costPrice = i.cost;
    });
    audit('create', 'purchase', pur.id, 'Omborga kirim: ' + money(total) + ' (' + items.length + ' nomdagi mahsulot)');
    save();
    return pur;
  }
  function cancelPurchase(id, reason) {
    const pur = S.purchases.find(x => x.id === id); if (!pur || pur.canceled) return false;
    pur.canceled = true; pur.canceledAt = Date.now(); pur.cancelReason = reason || '';
    S.stock_movements.forEach(m => { if (m.refType === 'purchase' && m.refId === id) m.canceled = true; });
    audit('cancel', 'purchase', id, 'Kirim bekor qilindi: ' + money(pur.total) + (reason ? ' — ' + reason : ''));
    save();
    return true;
  }

  function addSale(data) {
    // data: {items:[{productId,qty,price}], method, customerId, note, date}
    const items = (data.items || []).filter(i => i.qty > 0);
    if (!items.length) return null;
    let total = 0, cost = 0;
    const rows = items.map(i => {
      const p = S.products.find(x => x.id === i.productId);
      const price = parseMoney(i.price);
      const c = p ? p.costPrice : 0;
      total += price * i.qty; cost += c * i.qty;
      return { id: uid('sit'), productId: i.productId, name: p ? p.name : '?', qty: i.qty, price, cost: c };
    });
    const sale = {
      id: uid('sal'), date: data.date || todayISO(), ts: Date.now(),
      customerId: data.customerId || null, method: data.method || 'naqd',
      total, cost, cashier: S.settings.cashier, note: String(data.note || '').trim(), canceled: false
    };
    S.sales.push(sale);
    rows.forEach(r => {
      r.saleId = sale.id;
      S.sale_items.push(r);
      S.stock_movements.push({
        id: uid('mov'), productId: r.productId, qty: -r.qty, type: 'sale', refType: 'sale', refId: sale.id,
        date: sale.date, ts: Date.now(), note: 'Sotuv', cashier: S.settings.cashier
      });
    });
    if (sale.method === 'qarz' && sale.customerId) {
      const d = addDebt({
        customerId: sale.customerId, amount: total, date: sale.date,
        dueDate: addDays(sale.date, S.settings.defaultDueDays || 7),
        reason: 'Magazin xaridi (qarzga)', saleId: sale.id, _silent: true
      });
      sale.debtId = d.id;
    }
    audit('create', 'sale', sale.id, 'Sotuv: ' + money(total) + ' (' + methodName(sale.method) + ')');
    save();
    return sale;
  }
  function cancelSale(id, reason) {
    const s = S.sales.find(x => x.id === id); if (!s || s.canceled) return false;
    s.canceled = true; s.canceledAt = Date.now(); s.cancelReason = reason || '';
    S.stock_movements.forEach(m => { if (m.refType === 'sale' && m.refId === id) m.canceled = true; });
    if (s.debtId) {
      const d = S.debts.find(x => x.id === s.debtId);
      if (d) { d.canceled = true; d.cancelReason = 'Sotuv bekor qilindi'; }
    }
    audit('cancel', 'sale', id, 'Sotuv bekor qilindi: ' + money(s.total) + (reason ? ' — ' + reason : ''));
    save();
    return true;
  }

  function stockOut(productId, qty, reason) { // chiqim (yaroqsiz, sinish, ichki ishlatish)
    const p = S.products.find(x => x.id === productId); if (!p) return false;
    S.stock_movements.push({
      id: uid('mov'), productId, qty: -Math.abs(qty), type: 'out', refType: 'writeoff', refId: null,
      date: todayISO(), ts: Date.now(), note: reason || 'Chiqim', cashier: S.settings.cashier
    });
    audit('stock', 'product', productId, p.name + ': chiqim ' + Math.abs(qty) + ' ' + p.unit + (reason ? ' — ' + reason : ''));
    save();
    return true;
  }

  function inventoryAdjust(productId, realQty, reason) {
    const p = S.products.find(x => x.id === productId); if (!p) return false;
    cache = null;
    const cur = compute().prodById.get(productId);
    const sys = cur ? cur.qty : 0;
    const diff = realQty - sys;
    S.inventory_adjustments.push({
      id: uid('inv'), productId, systemQty: sys, realQty, diff, reason: reason || '',
      date: todayISO(), ts: Date.now(), cashier: S.settings.cashier
    });
    if (diff !== 0) {
      S.stock_movements.push({
        id: uid('mov'), productId, qty: diff, type: 'adjust', refType: 'inventory', refId: null,
        date: todayISO(), ts: Date.now(), note: 'Inventarizatsiya: ' + (reason || ''), cashier: S.settings.cashier
      });
    }
    audit('inventory', 'product', productId, p.name + ': inventarizatsiya ' + sys + ' → ' + realQty + ' (' + (diff > 0 ? '+' : '') + diff + ')' + (reason ? ' — ' + reason : ''));
    save();
    return true;
  }

  /* ------------------------- Kategoriya / Yetkazib beruvchi ------------------------- */
  function addCategory(name) {
    const c = { id: uid('cat'), name: String(name || '').trim() };
    S.categories.push(c); audit('create', 'category', c.id, 'Kategoriya qo‘shildi: ' + c.name); save(); return c;
  }
  function updateCategory(id, name) {
    const c = S.categories.find(x => x.id === id); if (!c) return null;
    c.name = String(name || '').trim(); audit('update', 'category', id, 'Kategoriya tahrirlandi: ' + c.name); save(); return c;
  }
  function deleteCategory(id) {
    if (S.products.some(p => p.categoryId === id)) return false;
    S.categories = S.categories.filter(x => x.id !== id);
    audit('delete', 'category', id, 'Kategoriya o‘chirildi'); save(); return true;
  }
  function addSupplier(data) {
    const s = {
      id: uid('sup'), name: String(data.name || '').trim(), phone: normPhone(data.phone),
      address: String(data.address || '').trim(), note: String(data.note || '').trim(), createdAt: Date.now()
    };
    S.suppliers.push(s); audit('create', 'supplier', s.id, 'Yetkazib beruvchi qo‘shildi: ' + s.name); save(); return s;
  }
  function updateSupplier(id, data) {
    const s = S.suppliers.find(x => x.id === id); if (!s) return null;
    Object.assign(s, {
      name: String(data.name || '').trim(), phone: normPhone(data.phone),
      address: String(data.address || '').trim(), note: String(data.note || '').trim()
    });
    audit('update', 'supplier', id, 'Yetkazib beruvchi tahrirlandi: ' + s.name); save(); return s;
  }
  function deleteSupplier(id) {
    if (S.products.some(p => p.supplierId === id) || S.purchases.some(p => p.supplierId === id)) return false;
    S.suppliers = S.suppliers.filter(x => x.id !== id);
    audit('delete', 'supplier', id, 'Yetkazib beruvchi o‘chirildi'); save(); return true;
  }

  /* ------------------------- Mijoz tarixi ------------------------- */
  function customerHistory(customerId) {
    const out = [];
    S.debts.forEach(d => { if (d.customerId === customerId) out.push({ type: 'debt', ts: d.createdAt || 0, date: d.date, amount: d.amount, obj: d }); });
    S.payments.forEach(p => { if (p.customerId === customerId) out.push({ type: 'pay', ts: p.createdAt || 0, date: p.date, amount: p.amount, obj: p }); });
    out.sort((a, b) => (a.date === b.date ? b.ts - a.ts : (a.date < b.date ? 1 : -1)));
    return out;
  }

  /* ------------------------- Validatsiya ------------------------- */
  const V = {
    debt(data) {
      const e = {};
      if (!data.customerId) e.customerId = 'Mijozni tanlang';
      const a = parseMoney(data.amount);
      if (isNaN(a)) e.amount = 'Summani kiriting';
      else if (a <= 0) e.amount = 'Qarz summasi 0 dan katta bo‘lishi kerak';
      else if (a > 1e12) e.amount = 'Summa juda katta';
      if (!data.date || !isoToDate(data.date)) e.date = 'Sana noto‘g‘ri';
      if (data.dueDate) {
        if (!isoToDate(data.dueDate)) e.dueDate = 'Muddat sanasi noto‘g‘ri';
        else if (daysDiff(data.dueDate, data.date) < 0) e.dueDate = 'To‘lash muddati qarz sanasidan oldin bo‘lishi mumkin emas';
      }
      return e;
    },
    payment(data, ctx) {
      const e = {};
      if (!data.customerId) e.customerId = 'Mijozni tanlang';
      const a = parseMoney(data.amount);
      if (isNaN(a)) e.amount = 'To‘lov summasini kiriting';
      else if (a <= 0) e.amount = 'To‘lov 0 dan katta bo‘lishi kerak';
      else if (ctx && a > ctx.maxAmount) e.amount = 'To‘lov qolgan qarzdan (' + money(ctx.maxAmount) + ') katta bo‘lishi mumkin emas';
      if (!data.date || !isoToDate(data.date)) e.date = 'Sana noto‘g‘ri';
      return e;
    },
    customer(data, id) {
      const e = {};
      const n = String(data.name || '').trim();
      if (!n) e.name = 'Ismni kiriting';
      else if (n.length < 2) e.name = 'Ism juda qisqa';
      else if (S.customers.some(c => c.id !== id && c.name.toLowerCase() === n.toLowerCase() && normPhone(c.phone) === normPhone(data.phone)))
        e.name = 'Bu ism va telefon bilan mijoz allaqachon mavjud';
      if (data.phone && !validPhone(data.phone)) e.phone = 'Telefon raqami noto‘g‘ri (masalan: +998 90 123 45 67)';
      return e;
    },
    product(data) {
      const e = {};
      if (!String(data.name || '').trim()) e.name = 'Mahsulot nomini kiriting';
      const c = parseMoney(data.costPrice), s = parseMoney(data.salePrice);
      if (isNaN(c) || c < 0) e.costPrice = 'Kirim narxini to‘g‘ri kiriting';
      if (isNaN(s) || s <= 0) e.salePrice = 'Sotish narxi 0 dan katta bo‘lishi kerak';
      if (!isNaN(c) && !isNaN(s) && s < c) e.salePrice = 'Sotish narxi tannarxdan kichik — zarar bo‘ladi';
      const m = parseInt(data.minStock, 10);
      if (data.minStock !== '' && (isNaN(m) || m < 0)) e.minStock = 'Minimal qoldiq noto‘g‘ri';
      return e;
    }
  };

  /* ------------------------- Export / Import ------------------------- */
  function exportJSON() {
    return JSON.stringify({ app: 'QarzDaftar', schema: SCHEMA, exportedAt: new Date().toISOString(), data: S }, null, 2);
  }
  function validateBackup(obj) {
    const res = { ok: false, reason: '', stats: null };
    if (!obj || typeof obj !== 'object') { res.reason = 'Fayl JSON formatida emas'; return res; }
    const d = obj.data || obj;
    const need = ['customers', 'debts', 'payments', 'products', 'settings'];
    for (const k of need) {
      if (!(k in d)) { res.reason = 'Backup faylida "' + k + '" jadvali topilmadi'; return res; }
    }
    if (!Array.isArray(d.customers) || !Array.isArray(d.debts) || !Array.isArray(d.payments)) {
      res.reason = 'Backup fayl strukturasi buzilgan'; return res;
    }
    res.ok = true;
    res.stats = {
      customers: d.customers.length, debts: d.debts.length, payments: d.payments.length,
      products: (d.products || []).length, sales: (d.sales || []).length,
      exportedAt: obj.exportedAt || null
    };
    return res;
  }
  function importJSON(obj) {
    const v = validateBackup(obj);
    if (!v.ok) return v;
    S = migrate(obj.data || obj);
    cache = null;
    persist();
    audit('restore', 'system', null, 'Ma’lumotlar backupdan tiklandi');
    persist();
    return v;
  }

  function toCSV(rows, headers) {
    const esc2 = (v) => {
      const s = String(v == null ? '' : v);
      return /[",;\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    const head = headers.map(h => esc2(h.label)).join(';');
    const body = rows.map(r => headers.map(h => esc2(typeof h.get === 'function' ? h.get(r) : r[h.key])).join(';'));
    return '﻿' + [head].concat(body).join('\r\n');
  }
  function download(filename, content, mime) {
    const blob = content instanceof Blob ? content : new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 500);
  }

  /* ------------------------- Public API ------------------------- */
  Object.assign(GC, {
    SCHEMA, DB_KEY, UNITS, views: {}, actions: {}, inputHandlers: {}, PAY_METHODS, SALE_METHODS, MONTHS, WEEK,
    setState(next) { S = migrate(next); cache = null; },
    load, save, persist, invalidate() { cache = null; },
    compute, audit, defaultState, migrate,
    money, moneyShort, groupNum, parseMoney, fmtDate, fmtDT, fmtTime, todayISO, dateToISO, isoToDate,
    daysDiff, addDays, fmtSize, esc, uid, normPhone, fmtPhone, validPhone, methodName,
    addCustomer, updateCustomer, deleteCustomer,
    addDebt, updateDebt, cancelDebt, deleteDebt,
    addPayment, updatePayment, deletePayment,
    addProduct, updateProduct, deleteProduct,
    addPurchase, cancelPurchase, addSale, cancelSale, stockOut, inventoryAdjust,
    addCategory, updateCategory, deleteCategory,
    addSupplier, updateSupplier, deleteSupplier,
    customerHistory, V, exportJSON, importJSON, validateBackup, toCSV, download
  });
  // MUHIM: Object.assign getterlarni qiymatga aylantiradi, shuning uchun alohida e'lon qilinadi
  Object.defineProperty(GC, 'state', { get() { return S; }, enumerable: true });
})();

</script>
<script>
/* =========================================================================
   Qarz Daftar — AVTO BACKUP TIZIMI
   - Foydalanuvchi papkani BIR MARTA tanlaydi (handle IndexedDB'da saqlanadi)
   - Har bir o'zgarishdan KEYIN debounce bilan avtomatik backup
   - Doim BITTA fayl: GameClub_Backup.db (yangilanadi, yangi fayl yaratilmaydi)
   - Atomik yozish: .tmp → tekshirish → asosiy faylga almashtirish
   - Xatolik dasturni to'xtatmaydi, faqat ogohlantiradi
   ========================================================================= */
(function () {
  'use strict';
  const GC = window.GC;
  const FILE_MAIN = 'GameClub_Backup.db';
  const FILE_TMP = 'GameClub_Backup.tmp';
  const FILE_SAFETY = 'GameClub_Safety_Backup.db';
  const IDB_NAME = 'qarz_daftar_fs';
  const IDB_STORE = 'handles';

  const status = {
    supported: false,
    mode: 'none',        // 'native' (Electron) | 'fs' (File System Access) | 'none'
    folderName: '',
    folderPath: '',
    connected: false,
    lastAt: null,
    lastSize: null,
    lastStatus: 'idle',  // ok | err | idle | pending
    lastError: '',
    pending: false,
    busy: false
  };

  let dirHandle = null;
  let timer = null;
  let queued = false;

  /* ---------------- IndexedDB (handle saqlash) ---------------- */
  function idb() {
    return new Promise((res, rej) => {
      const r = indexedDB.open(IDB_NAME, 1);
      r.onupgradeneeded = () => { r.result.createObjectStore(IDB_STORE); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  async function idbSet(key, val) {
    try {
      const db = await idb();
      await new Promise((res, rej) => {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).put(val, key);
        tx.oncomplete = res; tx.onerror = () => rej(tx.error);
      });
    } catch (e) { console.warn('idbSet', e); }
  }
  async function idbGet(key) {
    try {
      const db = await idb();
      return await new Promise((res, rej) => {
        const tx = db.transaction(IDB_STORE, 'readonly');
        const rq = tx.objectStore(IDB_STORE).get(key);
        rq.onsuccess = () => res(rq.result);
        rq.onerror = () => rej(rq.error);
      });
    } catch (e) { return null; }
  }
  async function idbDel(key) {
    try {
      const db = await idb();
      await new Promise((res) => {
        const tx = db.transaction(IDB_STORE, 'readwrite');
        tx.objectStore(IDB_STORE).delete(key); tx.oncomplete = res; tx.onerror = res;
      });
    } catch (e) {}
  }

  /* ---------------- Log ---------------- */
  function log(type, ok, size, message) {
    const S = GC.state;
    S.backup_logs.push({
      id: GC.uid('bkp'), ts: Date.now(), type, status: ok ? 'ok' : 'err',
      size: size || 0, message: message || ''
    });
    // loglar juda ko'payib ketmasligi uchun oxirgi 300 tasi saqlanadi
    if (S.backup_logs.length > 300) S.backup_logs.splice(0, S.backup_logs.length - 300);
    GC.persist();
  }

  /* ---------------- Adapterlar ---------------- */
  const native = {
    get available() { return !!(window.gcNative && window.gcNative.backup); },
    async pickFolder() {
      const p = await window.gcNative.backup.pickFolder();
      if (!p) return null;
      status.folderPath = p; status.folderName = p;
      GC.state.settings.backupPath = p; GC.persist();
      return p;
    },
    async write(text) { return window.gcNative.backup.write(GC.state.settings.backupPath, text); },
    async readMain() { return window.gcNative.backup.readMain(GC.state.settings.backupPath); },
    async safety(text) { return window.gcNative.backup.safety(GC.state.settings.backupPath, text); },
    async check() { return window.gcNative.backup.check(GC.state.settings.backupPath); }
  };

  const fsa = {
    get available() { return typeof window.showDirectoryPicker === 'function'; },
    async pickFolder() {
      const h = await window.showDirectoryPicker({ id: 'gc-backup', mode: 'readwrite', startIn: 'documents' });
      const ok = await ensurePermission(h, true);
      if (!ok) throw new Error('Papkaga yozish uchun ruxsat berilmadi');
      dirHandle = h;
      await idbSet('dir', h);
      status.folderName = h.name; status.folderPath = h.name;
      GC.state.settings.backupPath = h.name; GC.persist();
      return h.name;
    },
    async write(text) {
      if (!dirHandle) throw new Error('Backup papkasi tanlanmagan');
      if (!(await ensurePermission(dirHandle, true))) throw new Error('Papkaga ruxsat yo‘q (qayta tanlang)');
      // 1) vaqtinchalik faylga yozamiz
      const tmp = await dirHandle.getFileHandle(FILE_TMP, { create: true });
      const w = await tmp.createWritable();
      await w.write(text); await w.close();
      // 2) tekshiramiz
      const tf = await tmp.getFile();
      const back = await tf.text();
      if (back.length !== text.length) throw new Error('Vaqtinchalik backup to‘liq yozilmadi');
      JSON.parse(back); // buzilmaganini tasdiqlash
      // 3) asosiy faylga ko'chiramiz
      const main = await dirHandle.getFileHandle(FILE_MAIN, { create: true });
      const w2 = await main.createWritable();
      await w2.write(back); await w2.close();
      // 4) tekshirib, tmp ni o'chiramiz
      const mf = await main.getFile();
      const mtext = await mf.text();
      JSON.parse(mtext);
      try { await dirHandle.removeEntry(FILE_TMP); } catch (e) {}
      return { size: mf.size, path: dirHandle.name + '/' + FILE_MAIN };
    },
    async readMain() {
      if (!dirHandle) throw new Error('Backup papkasi tanlanmagan');
      const h = await dirHandle.getFileHandle(FILE_MAIN);
      const f = await h.getFile();
      return { text: await f.text(), size: f.size, modified: f.lastModified };
    },
    async safety(text) {
      if (!dirHandle) return null;
      const h = await dirHandle.getFileHandle(FILE_SAFETY, { create: true });
      const w = await h.createWritable();
      await w.write(text); await w.close();
      const f = await h.getFile();
      return { size: f.size };
    },
    async check() {
      const r = await fsa.readMain();
      const obj = JSON.parse(r.text);
      const v = GC.validateBackup(obj);
      return Object.assign({ size: r.size, modified: r.modified }, v);
    }
  };

  async function ensurePermission(handle, request) {
    if (!handle || !handle.queryPermission) return true;
    const opts = { mode: 'readwrite' };
    let st = await handle.queryPermission(opts);
    if (st === 'granted') return true;
    if (request && handle.requestPermission) st = await handle.requestPermission(opts);
    return st === 'granted';
  }

  function adapter() {
    if (native.available) return native;
    if (fsa.available) return fsa;
    return null;
  }

  /* ---------------- Asosiy operatsiyalar ---------------- */
  async function init() {
    status.supported = !!adapter();
    status.mode = native.available ? 'native' : (fsa.available ? 'fs' : 'none');
    if (fsa.available && !native.available) {
      const h = await idbGet('dir');
      if (h) {
        dirHandle = h;
        status.folderName = h.name; status.folderPath = h.name;
        const ok = await ensurePermission(h, false);
        status.connected = ok;
        if (!ok) { status.lastStatus = 'warn'; status.lastError = 'Papkaga ruxsat tiklanmadi — "Ruxsatni tiklash" tugmasini bosing'; }
      }
    } else if (native.available && GC.state.settings.backupPath) {
      status.folderPath = GC.state.settings.backupPath;
      status.folderName = GC.state.settings.backupPath;
      status.connected = true;
    }
    const last = GC.state.backup_logs.slice(-1)[0];
    if (last) { status.lastAt = last.ts; status.lastSize = last.size; status.lastStatus = last.status; }
    GC.emit && GC.emit('backup');
  }

  async function chooseFolder() {
    const a = adapter();
    if (!a) {
      GC.toast('Bu brauzer papka tanlashni qo‘llab-quvvatlamaydi. Chrome/Edge yoki Windows dasturidan foydalaning.', 'err', 6000);
      return false;
    }
    try {
      const name = await a.pickFolder();
      if (!name) return false;
      status.connected = true; status.lastError = '';
      GC.toast('Backup papkasi tanlandi: ' + name, 'ok');
      await run('manual');
      return true;
    } catch (e) {
      if (e && e.name === 'AbortError') return false;
      status.lastError = e.message || String(e);
      GC.toast('Papka tanlanmadi: ' + status.lastError, 'err');
      return false;
    }
  }

  async function restorePermission() {
    if (!dirHandle) return false;
    const ok = await ensurePermission(dirHandle, true);
    status.connected = ok;
    if (ok) { status.lastError = ''; GC.toast('Ruxsat tiklandi', 'ok'); await run('manual'); }
    else GC.toast('Ruxsat berilmadi', 'err');
    GC.emit && GC.emit('backup');
    return ok;
  }

  function friendlyError(e) {
    const m = (e && (e.message || e.name) || '').toLowerCase();
    if (m.includes('notfound') || m.includes('not found')) return 'Backup papkasi yoki fayl topilmadi (papka o‘chirilgan yoki disk ulanmagan)';
    if (m.includes('notallowed') || m.includes('permission') || m.includes('ruxsat')) return 'Papkaga ruxsat berilmagan';
    if (m.includes('quota') || m.includes('space') || m.includes('enospc')) return 'Diskda joy yetarli emas';
    if (m.includes('busy') || m.includes('lock') || m.includes('eperm') || m.includes('ebusy')) return 'Backup fayli boshqa dastur tomonidan bloklangan';
    if (m.includes('nodev') || m.includes('enoent')) return 'Disk mavjud emas';
    return (e && e.message) || 'Noma’lum xato';
  }

  async function run(type) {
    const a = adapter();
    if (!a) return false;
    if (!status.connected && !(native.available && GC.state.settings.backupPath)) {
      status.lastStatus = 'idle';
      return false;
    }
    if (status.busy) { queued = true; return false; }
    status.busy = true; status.pending = false;
    try {
      const text = GC.exportJSON();
      const res = await a.write(text);
      status.lastAt = Date.now();
      status.lastSize = res && res.size ? res.size : text.length;
      status.lastStatus = 'ok'; status.lastError = '';
      GC.state.settings.lastBackupAt = status.lastAt;
      log(type === 'manual' ? 'manual' : 'auto', true, status.lastSize, '');
      if (type === 'manual') GC.toast('Backup muvaffaqiyatli yaratildi (' + GC.fmtSize(status.lastSize) + ')', 'ok');
      return true;
    } catch (e) {
      status.lastStatus = 'err';
      status.lastError = friendlyError(e);
      log(type === 'manual' ? 'manual' : 'auto', false, 0, status.lastError);
      GC.toast('🔴 Backup bajarilmadi: ' + status.lastError, 'err', 5000);
      return false;
    } finally {
      status.busy = false;
      GC.emit && GC.emit('backup');
      if (queued) { queued = false; schedule(); }
    }
  }

  /* Debounce: kassir ketma-ket kiritsa ham dastur sekinlashmaydi */
  function schedule() {
    if (!GC.state.settings.autoBackup) return;
    if (!adapter() || !status.connected) return;
    status.pending = true;
    clearTimeout(timer);
    timer = setTimeout(() => { timer = null; run('auto'); }, GC.state.settings.backupDebounceMs || 1500);
  }

  async function flush() { // dastur yopilishidan oldin majburiy backup
    if (timer) { clearTimeout(timer); timer = null; }
    if (status.pending || queued) { queued = false; return run('auto'); }
    return true;
  }

  async function check() {
    const a = adapter();
    if (!a || !status.connected) { GC.toast('Avval backup papkasini tanlang', 'warn'); return null; }
    try {
      const r = await a.check();
      if (r.ok) {
        GC.toast('✅ Backup fayli to‘g‘ri: ' + r.stats.customers + ' mijoz, ' + r.stats.debts + ' qarz, ' +
                 r.stats.payments + ' to‘lov · ' + GC.fmtSize(r.size), 'ok', 6000);
      } else {
        GC.toast('🔴 Backup fayli yaroqsiz: ' + r.reason, 'err', 6000);
      }
      return r;
    } catch (e) {
      const msg = friendlyError(e);
      GC.toast('🔴 Backupni tekshirib bo‘lmadi: ' + msg, 'err', 6000);
      return { ok: false, reason: msg };
    }
  }

  async function readMainBackup() {
    const a = adapter();
    if (!a || !status.connected) return null;
    try { return await a.readMain(); } catch (e) { return null; }
  }

  async function safetyBackup() {
    const a = adapter();
    const text = GC.exportJSON();
    if (a && status.connected) {
      try {
        const r = await a.safety(text);
        log('safety', true, (r && r.size) || text.length, 'Tiklashdan oldingi zaxira');
        return true;
      } catch (e) {
        log('safety', false, 0, friendlyError(e));
      }
    }
    // papka yo'q bo'lsa — brauzer orqali yuklab olamiz
    GC.download('GameClub_Safety_Backup_' + GC.todayISO() + '.db', text, 'application/json');
    return true;
  }

  /* Dastur yopilishida */
  window.addEventListener('beforeunload', (e) => {
    if (status.pending && GC.state.settings.autoBackup && status.connected) {
      flush();
      e.preventDefault();
      e.returnValue = 'Backup hali yakunlanmadi. Chiqishni xohlaysizmi?';
      return e.returnValue;
    }
  });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });

  GC.Backup = {
    status, init, chooseFolder, restorePermission, run, schedule, flush, check,
    readMainBackup, safetyBackup, FILE_MAIN, FILE_SAFETY,
    forget: async () => { await idbDel('dir'); dirHandle = null; status.connected = false; status.folderName = ''; GC.emit && GC.emit('backup'); }
  };
})();

</script>
<script>
/* =========================================================================
   Qarz Daftar — UI KOMPONENTLARI
   Toast, Modal, Confirm, Forma yordamchilari, Jadval, Grafiklar, Chek
   ========================================================================= */
(function () {
  'use strict';
  const GC = window.GC;
  const esc = GC.esc, money = GC.money;

  /* ---------------- Event bus ---------------- */
  const listeners = {};
  GC.on = (ev, fn) => { (listeners[ev] = listeners[ev] || []).push(fn); };
  GC.emit = (ev, data) => { (listeners[ev] || []).forEach(f => { try { f(data); } catch (e) { console.error(e); } }); };

  /* ---------------- Toast ---------------- */
  GC.toast = function (msg, type, ms) {
    const root = document.getElementById('toastRoot');
    if (!root) return;
    const d = document.createElement('div');
    d.className = 'toast ' + (type || '');
    d.innerHTML = esc(msg);
    root.appendChild(d);
    setTimeout(() => {
      d.style.transition = '.25s'; d.style.opacity = '0'; d.style.transform = 'translateX(20px)';
      setTimeout(() => d.remove(), 260);
    }, ms || 3000);
  };

  /* ---------------- Modal ---------------- */
  const stack = [];
  GC.modal = function (opt) {
    const root = document.getElementById('modalRoot');
    const wrap = document.createElement('div');
    wrap.className = 'modal ' + (opt.size || '');
    wrap.innerHTML =
      '<div class="modal-head"><div class="modal-title">' + esc(opt.title || '') + '</div>' +
      '<div class="spacer"></div><button class="icon-btn" data-mclose>✕</button></div>' +
      '<div class="modal-body">' + (opt.body || '') + '</div>' +
      (opt.footer ? '<div class="modal-foot">' + opt.footer + '</div>' : '');
    root.hidden = false;
    root.innerHTML = '';
    root.appendChild(wrap);
    const handle = {
      el: wrap,
      close() {
        const i = stack.indexOf(handle);
        if (i >= 0) stack.splice(i, 1);
        if (stack.length) {
          root.innerHTML = ''; root.appendChild(stack[stack.length - 1].el);
        } else { root.hidden = true; root.innerHTML = ''; }
        if (opt.onClose) opt.onClose();
      },
      q(sel) { return wrap.querySelector(sel); },
      qa(sel) { return Array.prototype.slice.call(wrap.querySelectorAll(sel)); },
      values() { return GC.formValues(wrap); }
    };
    stack.push(handle);
    wrap.querySelectorAll('[data-mclose]').forEach(b => b.addEventListener('click', () => handle.close()));
    root.onclick = (e) => { if (e.target === root) handle.close(); };
    if (opt.onMount) opt.onMount(handle);
    GC.initMoneyInputs(wrap);
    const first = wrap.querySelector('[data-autofocus],input:not([type=hidden]):not([readonly]),select');
    if (first) setTimeout(() => first.focus(), 40);
    return handle;
  };
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && stack.length) stack[stack.length - 1].close();
  });

  GC.confirm = function (opt) {
    return new Promise((resolve) => {
      const m = GC.modal({
        title: opt.title || 'Tasdiqlang',
        size: opt.size || '',
        body: '<div class="confirm-text">' + (opt.html || esc(opt.text || '')) + '</div>' +
              (opt.reason ? '<div class="field" style="margin-top:14px"><label>Sabab (audit uchun saqlanadi)</label>' +
                '<input class="input" name="reason" placeholder="Masalan: noto‘g‘ri kiritildi"></div>' : ''),
        footer: '<button class="btn" data-no>Bekor qilish</button>' +
                '<button class="btn ' + (opt.danger ? 'btn-danger' : 'btn-primary') + '" data-yes>' + esc(opt.okText || 'Davom etish') + '</button>',
        onClose: () => resolve(false)
      });
      m.q('[data-no]').addEventListener('click', () => m.close());
      m.q('[data-yes]').addEventListener('click', () => {
        const r = m.q('[name=reason]');
        const val = r ? r.value.trim() : true;
        const i = stack.indexOf(m); if (i >= 0) stack.splice(i, 1);
        const root = document.getElementById('modalRoot');
        if (stack.length) { root.innerHTML = ''; root.appendChild(stack[stack.length - 1].el); }
        else { root.hidden = true; root.innerHTML = ''; }
        resolve(opt.reason ? (val || ' ') : true);
      });
    });
  };

  /* ---------------- Forma yordamchilari ---------------- */
  GC.formValues = function (scope) {
    const out = {};
    scope.querySelectorAll('[name]').forEach(el => {
      if (el.type === 'checkbox') out[el.name] = el.checked;
      else if (el.type === 'radio') { if (el.checked) out[el.name] = el.value; }
      else if (el.dataset.money !== undefined) out[el.name] = GC.parseMoney(el.value);
      else out[el.name] = el.value;
    });
    return out;
  };
  GC.showErrors = function (scope, errors) {
    scope.querySelectorAll('.field').forEach(f => f.classList.remove('invalid'));
    let first = null;
    Object.keys(errors).forEach(k => {
      const el = scope.querySelector('[name="' + k + '"]');
      if (!el) { GC.toast(errors[k], 'err'); return; }
      const f = el.closest('.field');
      if (f) {
        f.classList.add('invalid');
        let e = f.querySelector('.err');
        if (!e) { e = document.createElement('div'); e.className = 'err'; f.appendChild(e); }
        e.textContent = errors[k];
      } else GC.toast(errors[k], 'err');
      if (!first) first = el;
    });
    if (first) first.focus();
    return Object.keys(errors).length === 0;
  };
  GC.initMoneyInputs = function (scope) {
    scope.querySelectorAll('input[data-money]').forEach(el => {
      if (el._moneyBound) return;
      el._moneyBound = true;
      el.setAttribute('inputmode', 'numeric');
      el.classList.add('money');
      const fmt = () => {
        const pos = el.selectionStart, len = el.value.length;
        const n = GC.parseMoney(el.value);
        el.value = isNaN(n) ? '' : GC.groupNum(n);
        const dl = el.value.length - len;
        try { el.setSelectionRange(Math.max(0, pos + dl), Math.max(0, pos + dl)); } catch (e) {}
      };
      el.addEventListener('input', fmt);
      el.addEventListener('blur', fmt);
      if (el.value) fmt();
    });
  };

  /* Mijoz tanlash (qidiruvli) */
  GC.customerSelect = function (name, selectedId, extra) {
    const st = GC.compute();
    const list = st.customers.slice().sort((a, b) => a.c.name.localeCompare(b.c.name, 'uz'));
    return '<select class="select" name="' + name + '" ' + (extra || '') + '>' +
      '<option value="">— Mijozni tanlang —</option>' +
      list.map(x => '<option value="' + x.id + '"' + (x.id === selectedId ? ' selected' : '') + '>' +
        esc(x.c.name) + (x.c.phone ? ' · ' + esc(GC.fmtPhone(x.c.phone)) : '') +
        (x.remain > 0 ? ' · qolgan ' + GC.groupNum(x.remain) : '') + '</option>').join('') +
      '</select>';
  };
  GC.methodSelect = function (name, sel, withDebt) {
    const list = withDebt ? GC.SALE_METHODS : GC.PAY_METHODS;
    return '<select class="select" name="' + name + '">' +
      list.map(m => '<option value="' + m.id + '"' + (m.id === sel ? ' selected' : '') + '>' + esc(m.name) + '</option>').join('') + '</select>';
  };
  GC.cashierSelect = function (name, sel) {
    const list = GC.state.settings.cashiers || ['Admin'];
    return '<select class="select" name="' + name + '">' +
      list.map(c => '<option value="' + esc(c) + '"' + (c === sel ? ' selected' : '') + '>' + esc(c) + '</option>').join('') + '</select>';
  };

  /* ---------------- Badge / status ---------------- */
  const DEBT_STATUS = {
    paid: { c: 'b-green', t: '🟢 To‘langan' },
    open: { c: 'b-blue', t: '🔵 To‘lanmagan' },
    partial: { c: 'b-yellow', t: '🟡 Qisman to‘langan' },
    due_today: { c: 'b-yellow', t: '🟡 Bugun to‘lanadi' },
    overdue: { c: 'b-red', t: '🔴 Muddati o‘tgan' }
  };
  GC.debtBadge = function (row) {
    const s = DEBT_STATUS[row.status] || DEBT_STATUS.open;
    const extra = row.status === 'overdue' ? ' (' + row.dueDays + ' kun)' : '';
    return '<span class="badge ' + s.c + '">' + s.t + extra + '</span>';
  };
  GC.custBadge = function (x) {
    if (x.status === 'clear') return '<span class="badge b-green">🟢 Qarzi yo‘q</span>';
    if (x.status === 'overdue') return '<span class="badge b-red">🔴 Muddati o‘tgan</span>';
    return '<span class="badge b-yellow">🟡 Qarz mavjud</span>';
  };
  GC.stockBadge = function (x) {
    if (x.status === 'out') return '<span class="badge b-red">🔴 Tugagan</span>';
    if (x.status === 'low') return '<span class="badge b-yellow">🟡 Kam qoldi</span>';
    return '<span class="badge b-green">🟢 Mavjud</span>';
  };
  GC.avatar = function (name) {
    return '<div class="avatar">' + esc(String(name || '?').trim().charAt(0).toUpperCase()) + '</div>';
  };

  /* ---------------- Stat karta ---------------- */
  GC.statCard = function (label, value, sub, tone, icon) {
    return '<div class="card stat ' + (tone || '') + '">' +
      '<div class="lab">' + (icon ? '<span>' + icon + '</span>' : '') + esc(label) + '</div>' +
      '<div class="val">' + esc(value) + '</div>' +
      (sub ? '<div class="sub">' + sub + '</div>' : '') + '</div>';
  };

  /* ---------------- Pagination ---------------- */
  GC.paginate = function (rows, page, per) {
    const total = rows.length;
    const pages = Math.max(1, Math.ceil(total / per));
    const p = Math.min(Math.max(1, page), pages);
    return { rows: rows.slice((p - 1) * per, p * per), page: p, pages, total };
  };
  GC.pagerHTML = function (pg, key) {
    if (pg.total === 0) return '';
    const btn = (p, label, dis) => '<button class="btn btn-sm" data-action="page" data-key="' + key + '" data-page="' + p + '"' +
      (dis ? ' disabled' : '') + '>' + label + '</button>';
    return '<div class="pager"><span class="muted">Jami: <b>' + pg.total + '</b> ta yozuv · ' + pg.page + '/' + pg.pages + '-sahifa</span>' +
      '<div class="spacer"></div>' + btn(1, '«', pg.page === 1) + btn(pg.page - 1, '‹', pg.page === 1) +
      btn(pg.page + 1, '›', pg.page === pg.pages) + btn(pg.pages, '»', pg.page === pg.pages) + '</div>';
  };

  /* ---------------- Grafiklar (sof SVG) ---------------- */
  GC.chart = {
    bars(data, opts) {
      opts = opts || {};
      const w = 100, h = 100;
      const max = Math.max(1, ...data.map(d => Math.max(d.a || 0, d.b || 0)));
      const n = data.length || 1;
      const bw = 100 / n;
      let bars = '', labels = '';
      data.forEach((d, i) => {
        const x = i * bw;
        const ha = ((d.a || 0) / max) * 86;
        const hb = ((d.b || 0) / max) * 86;
        const pad = bw * 0.18;
        const each = (bw - pad * 2) / 2;
        bars += '<rect x="' + (x + pad) + '" y="' + (88 - ha) + '" width="' + (each * 0.9) + '" height="' + Math.max(0.4, ha) + '" fill="url(#gA)" rx="0.8"><title>' + esc(d.label + ' — Qarz: ' + money(d.a || 0)) + '</title></rect>';
        bars += '<rect x="' + (x + pad + each) + '" y="' + (88 - hb) + '" width="' + (each * 0.9) + '" height="' + Math.max(0.4, hb) + '" fill="url(#gB)" rx="0.8"><title>' + esc(d.label + ' — To‘lov: ' + money(d.b || 0)) + '</title></rect>';
        labels += '<text x="' + (x + bw / 2) + '" y="97" font-size="3.1" text-anchor="middle" fill="currentColor" opacity=".55">' + esc(d.label) + '</text>';
      });
      return '<svg class="chart" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
        '<defs><linearGradient id="gA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ef4444"/><stop offset="1" stop-color="#b91c1c"/></linearGradient>' +
        '<linearGradient id="gB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22c55e"/><stop offset="1" stop-color="#15803d"/></linearGradient></defs>' +
        '<line x1="0" y1="88" x2="100" y2="88" stroke="currentColor" stroke-width=".25" opacity=".25"/>' +
        bars + labels + '</svg>';
    },
    line(points, opts) {
      opts = opts || {};
      const max = Math.max(1, ...points.map(p => p.v));
      const n = points.length;
      if (!n) return '<div class="empty">Ma’lumot yo‘q</div>';
      const pts = points.map((p, i) => {
        const x = n === 1 ? 50 : (i / (n - 1)) * 100;
        const y = 88 - (p.v / max) * 82;
        return [x, y];
      });
      const path = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(2) + ' ' + p[1].toFixed(2)).join(' ');
      const area = path + ' L100 88 L0 88 Z';
      const dots = pts.map((p, i) => '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="0.9" fill="#22d3ee"><title>' +
        esc(points[i].label + ': ' + money(points[i].v)) + '</title></circle>').join('');
      const labels = points.map((p, i) => (n <= 14 || i % Math.ceil(n / 12) === 0)
        ? '<text x="' + pts[i][0] + '" y="97" font-size="3" text-anchor="middle" fill="currentColor" opacity=".5">' + esc(p.label) + '</text>' : '').join('');
      return '<svg class="chart" viewBox="0 0 100 100" preserveAspectRatio="none">' +
        '<defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">' +
