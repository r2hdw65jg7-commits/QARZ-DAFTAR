          '<td class="num" style="color:var(--ok)">' + money((i.price - i.cost) * i.qty) + '</td></tr>').join('') +
        '</tbody></table></div>' +
        '<div class="kv"><span class="k">Jami</span><span class="v">' + money(s.total) + '</span></div>' +
        '<div class="kv"><span class="k">Foyda</span><span class="v" style="color:var(--ok)">' + money(s.total - s.cost) + '</span></div>' +
        '<div class="kv"><span class="k">To‘lov turi</span><span class="v">' + esc(GC.methodName(s.method)) + '</span></div>' +
        '<div class="kv"><span class="k">Mijoz</span><span class="v">' + esc(c ? c.name : '—') + '</span></div>' +
        '<div class="kv"><span class="k">Sana</span><span class="v">' + fmtDate(s.date) + ' ' + GC.fmtTime(s.ts) + '</span></div>' +
        '<div class="kv"><span class="k">Kassir</span><span class="v">' + esc(s.cashier || '') + '</span></div>',
      footer: '<button class="btn" data-action="sale-receipt" data-id="' + s.id + '">🧾 Chek chiqarish</button><button class="btn" data-mclose>Yopish</button>'
    });
  };
  A['sale-receipt'] = (el) => {
    const s = GC.state.sales.find(x => x.id === el.dataset.id); if (!s) return;
    GC.printReceipt(GC.saleReceipt(s));
  };
  A['sale-cancel'] = async (el) => {
    const s = GC.state.sales.find(x => x.id === el.dataset.id); if (!s) return;
    const reason = await GC.confirm({
      title: 'Sotuvni bekor qilish', danger: true, okText: 'Bekor qilish', reason: true,
      html: '<b>' + money(s.total) + '</b> summadagi sotuv bekor qilinsinmi?<br>' +
        '<span class="muted">Mahsulotlar omborga qaytariladi' + (s.debtId ? ', mijoz qarzi kamayadi' : '') + '. Yozuv audit logda saqlanadi.</span>'
    });
    if (!reason) return;
    GC.cancelSale(s.id, reason === true ? '' : reason);
    GC.toast('Sotuv bekor qilindi, ombor tiklandi', 'ok');
  };

  /* --- Mahsulot --- */
  A['prod-filter'] = (el) => { UI.products[el.dataset.key] = el.dataset.val; UI.products.page = 1; GC.rerender(); };
  function productForm(p) {
    const S = GC.state;
    return '<div class="field"><label>Mahsulot nomi *</label><input class="input" name="name" value="' + esc(p ? p.name : '') + '" placeholder="Coca Cola 0.5L" data-autofocus><div class="err"></div></div>' +
      '<div class="grid2"><div class="field"><label>Kategoriya</label><select class="select" name="categoryId">' +
      S.categories.map(c => '<option value="' + c.id + '"' + (p && p.categoryId === c.id ? ' selected' : '') + '>' + esc(c.name) + '</option>').join('') + '</select></div>' +
      '<div class="field"><label>Birlik turi</label><select class="select" name="unit">' +
      GC.UNITS.map(u => '<option value="' + u + '"' + (p && p.unit === u ? ' selected' : '') + '>' + u + '</option>').join('') + '</select></div></div>' +
      '<div class="grid2"><div class="field"><label>Kirim narxi (tannarx) *</label><input class="input" name="costPrice" data-money value="' + (p ? GC.groupNum(p.costPrice) : '') + '" placeholder="8 000"><div class="err"></div></div>' +
      '<div class="field"><label>Sotish narxi *</label><input class="input" name="salePrice" data-money value="' + (p ? GC.groupNum(p.salePrice) : '') + '" placeholder="12 000"><div class="err"></div></div></div>' +
      '<div class="grid2">' + (p ? '' : '<div class="field"><label>Boshlang‘ich qoldiq</label><input class="input" type="number" name="startQty" value="0" min="0"></div>') +
      '<div class="field"><label>Minimal qoldiq (ogohlantirish uchun)</label><input class="input" type="number" name="minStock" value="' + (p ? (p.minStock || 0) : 5) + '" min="0"><div class="err"></div></div></div>' +
      '<div class="grid2"><div class="field"><label>Shtrix-kod (ixtiyoriy)</label><input class="input" name="barcode" value="' + esc(p ? p.barcode : '') + '"></div>' +
      '<div class="field"><label>Yetkazib beruvchi</label><select class="select" name="supplierId"><option value="">—</option>' +
      S.suppliers.map(s => '<option value="' + s.id + '"' + (p && p.supplierId === s.id ? ' selected' : '') + '>' + esc(s.name) + '</option>').join('') + '</select></div></div>' +
      '<div class="field"><label>Izoh</label><input class="input" name="note" value="' + esc(p ? p.note : '') + '"></div>';
  }
  A['new-product'] = () => {
    const m = GC.modal({
      title: '📦 Yangi mahsulot', size: 'wide', body: productForm(null),
      footer: '<button class="btn" data-mclose>Bekor qilish</button><button class="btn btn-primary" data-save>Saqlash</button>'
    });
    m.q('[data-save]').onclick = () => {
      const v = m.values(); const e = GC.V.product(v);
      if (!GC.showErrors(m.el, e)) return;
      GC.addProduct(v); m.close(); GC.toast('Mahsulot qo‘shildi', 'ok');
    };
  };
  A['prod-edit'] = (el) => {
    const p = GC.state.products.find(x => x.id === el.dataset.id); if (!p) return;
    const m = GC.modal({
      title: '✏️ Mahsulotni tahrirlash', size: 'wide', body: productForm(p),
      footer: '<button class="btn" data-mclose>Bekor qilish</button><button class="btn btn-primary" data-save>Saqlash</button>'
    });
    m.q('[data-save]').onclick = () => {
      const v = m.values(); const e = GC.V.product(v);
      if (!GC.showErrors(m.el, e)) return;
      GC.updateProduct(p.id, v); m.close(); GC.toast('Mahsulot yangilandi', 'ok');
    };
  };
  A['prod-delete'] = async (el) => {
    const p = GC.state.products.find(x => x.id === el.dataset.id); if (!p) return;
    const ok = await GC.confirm({
      title: 'Mahsulotni o‘chirish', danger: true, okText: 'O‘chirish',
      html: '<b>' + esc(p.name) + '</b> o‘chirilsinmi?<br><span class="muted">Sotuv tarixi bo‘lsa, mahsulot arxivga o‘tkaziladi (tarix buzilmaydi).</span>'
    });
    if (!ok) return;
    const r = GC.deleteProduct(p.id);
    GC.toast(r === 'archived' ? 'Mahsulot arxivlandi (sotuv tarixi saqlandi)' : 'Mahsulot o‘chirildi', 'ok');
  };
  A['prod-history'] = (el) => {
    const S = GC.state, x = GC.compute().prodById.get(el.dataset.id); if (!x) return;
    const moves = S.stock_movements.filter(m => m.productId === x.p.id && !m.canceled).sort((a, b) => b.ts - a.ts).slice(0, 100);
    const sold = S.sale_items.filter(i => i.productId === x.p.id);
    const soldQty = sold.reduce((s, i) => s + i.qty, 0);
    const profit = sold.reduce((s, i) => s + (i.price - i.cost) * i.qty, 0);
    const type = { in: ['🟢 Kirim', 'b-green'], sale: ['🔴 Sotuv', 'b-red'], out: ['🟠 Chiqim', 'b-yellow'], adjust: ['🔵 Tuzatish', 'b-blue'] };
    GC.modal({
      title: '📊 ' + x.p.name + ' — ombor harakatlari', size: 'wide',
      body: '<div class="cards" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">' +
        GC.statCard('Joriy qoldiq', x.qty + ' ' + x.p.unit, '', x.status === 'out' ? 'dan' : x.status === 'low' ? 'warn' : 'ok') +
        GC.statCard('Sotilgan', soldQty + ' ' + x.p.unit) +
        GC.statCard('Olingan foyda', money(profit), '', 'ok') +
        GC.statCard('Ombor qiymati', money(x.costValue)) + '</div>' +
        '<div class="table-wrap"><table class="tbl"><thead><tr><th>Vaqt</th><th>Turi</th><th class="num">Miqdor</th><th>Izoh</th></tr></thead><tbody>' +
        (moves.length ? moves.map(m => { const t = type[m.type] || ['—', 'b-gray'];
          return '<tr><td class="mono">' + fmtDate(m.date) + ' ' + GC.fmtTime(m.ts) + '</td><td><span class="badge ' + t[1] + '">' + t[0] + '</span></td>' +
            '<td class="num strong" style="color:' + (m.qty > 0 ? 'var(--ok)' : 'var(--dan)') + '">' + (m.qty > 0 ? '+' : '') + m.qty + '</td>' +
            '<td class="muted">' + esc(m.note || '') + '</td></tr>'; }).join('')
          : '<tr><td colspan="4"><div class="empty">Harakatlar yo‘q</div></td></tr>') + '</tbody></table></div>',
      footer: '<button class="btn" data-mclose>Yopish</button>'
    });
  };

  /* --- Kategoriyalar --- */
  A['categories'] = () => {
    const render = () => GC.state.categories.map(c =>
      '<div class="kv"><span class="k">' + esc(c.name) + ' <span class="muted">(' +
      GC.state.products.filter(p => p.categoryId === c.id).length + ' mahsulot)</span></span>' +
      '<span class="v"><button class="btn btn-sm" data-cedit="' + c.id + '">✏️</button> ' +
      '<button class="btn btn-sm btn-danger" data-cdel="' + c.id + '">🗑</button></span></div>').join('');
    const m = GC.modal({
      title: '🏷 Kategoriyalar',
      body: '<div data-list>' + render() + '</div>' +
        '<div class="row" style="margin-top:14px"><input class="input" name="newCat" placeholder="Yangi kategoriya nomi" style="flex:1">' +
        '<button class="btn btn-primary" data-add>Qo‘shish</button></div>',
      footer: '<button class="btn" data-mclose>Yopish</button>'
    });
    const refresh = () => { m.q('[data-list]').innerHTML = render(); bind(); };
    function bind() {
      m.qa('[data-cedit]').forEach(b => b.onclick = () => {
        const c = GC.state.categories.find(x => x.id === b.dataset.cedit);
        const name = prompt('Kategoriya nomi:', c.name);
        if (name && name.trim()) { GC.updateCategory(c.id, name.trim()); refresh(); }
      });
      m.qa('[data-cdel]').forEach(b => b.onclick = () => {
        if (!GC.deleteCategory(b.dataset.cdel)) GC.toast('Bu kategoriyada mahsulotlar bor — o‘chirib bo‘lmaydi', 'err');
        else { GC.toast('Kategoriya o‘chirildi', 'ok'); refresh(); }
      });
    }
    bind();
    m.q('[data-add]').onclick = () => {
      const i = m.q('[name=newCat]');
      if (!i.value.trim()) { GC.toast('Kategoriya nomini kiriting', 'err'); return; }
      GC.addCategory(i.value.trim()); i.value = ''; refresh(); GC.toast('Kategoriya qo‘shildi', 'ok');
    };
  };

  /* --- Ombor kirim / chiqim / inventarizatsiya --- */
  A['stock-tab'] = (el) => { UI.stock.tab = el.dataset.tab; UI.stock.page = 1; GC.rerender(); };
  A['stock-in'] = (el) => {
    const S = GC.state;
    if (!S.products.length) { GC.toast('Avval mahsulot qo‘shing', 'warn'); return; }
    const preId = el && el.dataset ? el.dataset.id : '';
    const rowHTML = (i) => '<div class="row" data-prow style="margin-bottom:8px;flex-wrap:nowrap">' +
      '<select class="select" data-p style="flex:2">' + S.products.filter(p => p.active !== false).map(p =>
        '<option value="' + p.id + '"' + (p.id === preId && i === 0 ? ' selected' : '') + '>' + esc(p.name) + '</option>').join('') + '</select>' +
      '<input class="input" type="number" data-q min="1" value="1" placeholder="Miqdor" style="width:90px">' +
      '<input class="input" data-c data-money placeholder="Narx" style="width:130px">' +
      '<button class="btn btn-danger btn-sm" data-prem>✕</button></div>';
    const m = GC.modal({
      title: '📥 Omborga kirim', size: 'wide',
      body: '<div class="grid2"><div class="field"><label>Yetkazib beruvchi</label><select class="select" name="supplierId"><option value="">—</option>' +
        S.suppliers.map(s => '<option value="' + s.id + '">' + esc(s.name) + '</option>').join('') + '</select></div>' +
        '<div class="field"><label>Sana</label><input class="input" type="date" name="date" value="' + GC.todayISO() + '"></div></div>' +
        '<label style="font-size:12px;color:var(--tx2);font-weight:600">Mahsulotlar</label>' +
        '<div data-rows>' + rowHTML(0) + '</div>' +
        '<button class="btn btn-sm" data-addrow>+ Qator qo‘shish</button>' +
        '<div class="field" style="margin-top:12px"><label>Izoh</label><input class="input" name="note" placeholder="Ixtiyoriy"></div>' +
        '<div class="kv"><span class="k">Jami summa</span><span class="v" data-total>0 so‘m</span></div>',
      footer: '<button class="btn" data-mclose>Bekor qilish</button><button class="btn btn-success" data-save>💾 Kirimni saqlash</button>'
    });
    function fillCost(row) {
      const pid = row.querySelector('[data-p]').value;
      const p = S.products.find(x => x.id === pid);
      const c = row.querySelector('[data-c]');
      if (p && !c.value) c.value = GC.groupNum(p.costPrice);
    }
    function recalc() {
      let total = 0;
      m.qa('[data-prow]').forEach(r => {
        total += (parseInt(r.querySelector('[data-q]').value, 10) || 0) * (GC.parseMoney(r.querySelector('[data-c]').value) || 0);
      });
      m.q('[data-total]').textContent = money(total);
    }
    function bindRow(r) {
      r.querySelector('[data-p]').onchange = () => { r.querySelector('[data-c]').value = ''; fillCost(r); recalc(); };
      r.querySelector('[data-prem]').onclick = () => { if (m.qa('[data-prow]').length > 1) { r.remove(); recalc(); } };
      r.querySelectorAll('input').forEach(i => i.addEventListener('input', recalc));
      fillCost(r); GC.initMoneyInputs(r);
    }
    m.qa('[data-prow]').forEach(bindRow);
    m.q('[data-addrow]').onclick = () => {
      const d = document.createElement('div'); d.innerHTML = rowHTML(1);
      const r = d.firstChild; m.q('[data-rows]').appendChild(r); bindRow(r); recalc();
    };
    recalc();
    m.q('[data-save]').onclick = () => {
      const items = [];
      let bad = false;
      m.qa('[data-prow]').forEach(r => {
        const qty = parseInt(r.querySelector('[data-q]').value, 10) || 0;
        const cost = GC.parseMoney(r.querySelector('[data-c]').value);
        if (qty <= 0) bad = true;
        if (isNaN(cost) || cost < 0) bad = true;
        items.push({ productId: r.querySelector('[data-p]').value, qty, cost: cost || 0 });
      });
      if (bad || !items.length) { GC.toast('Miqdor va narxni to‘g‘ri kiriting (0 dan katta)', 'err'); return; }
      const v = m.values();
      const pur = GC.addPurchase({ supplierId: v.supplierId, date: v.date, note: v.note, items });
      m.close();
      GC.toast('✅ Kirim saqlandi: ' + money(pur.total) + ' · Ombor yangilandi', 'ok', 4000);
    };
  };
  A['stock-out'] = (el) => {
    const x = GC.compute().prodById.get(el.dataset.id); if (!x) return;
    const m = GC.modal({
      title: '📤 Chiqim — ' + x.p.name,
      body: '<div class="kv"><span class="k">Joriy qoldiq</span><span class="v">' + x.qty + ' ' + esc(x.p.unit) + '</span></div>' +
        '<div class="field" style="margin-top:12px"><label>Chiqim miqdori *</label><input class="input" type="number" name="qty" min="1" value="1" data-autofocus><div class="err"></div></div>' +
        '<div class="field"><label>Sabab *</label><input class="input" name="reason" placeholder="Masalan: sinib qoldi / yaroqsiz / ichki ehtiyoj"><div class="err"></div></div>',
      footer: '<button class="btn" data-mclose>Bekor qilish</button><button class="btn btn-warn" data-save>Saqlash</button>'
    });
    m.q('[data-save]').onclick = () => {
      const v = m.values();
      const q = parseInt(v.qty, 10);
      const e = {};
      if (!q || q <= 0) e.qty = 'Miqdorni to‘g‘ri kiriting';
      else if (q > x.qty && !GC.state.settings.allowNegativeStock) e.qty = 'Omborda faqat ' + x.qty + ' ' + x.p.unit + ' bor';
      if (!String(v.reason || '').trim()) e.reason = 'Sababni kiriting';
      if (!GC.showErrors(m.el, e)) return;
      GC.stockOut(x.p.id, q, v.reason); m.close(); GC.toast('Chiqim saqlandi', 'ok');
    };
  };
  A['inventory'] = () => {
    const st = GC.compute();
    if (!st.products.length) { GC.toast('Mahsulotlar yo‘q', 'warn'); return; }
    const m = GC.modal({
      title: '🔍 Inventarizatsiya', size: 'wide',
      body: '<div class="muted" style="margin-bottom:10px">Omborni sanab chiqing va haqiqiy qoldiqni kiriting. Faqat farqi bor qatorlar saqlanadi.</div>' +
        '<div class="table-wrap"><table class="tbl"><thead><tr><th>Mahsulot</th><th class="num">Tizimda</th><th>Haqiqiy</th><th>Sabab</th></tr></thead><tbody>' +
        st.products.map(x => '<tr data-irow data-id="' + x.p.id + '"><td><b>' + esc(x.p.name) + '</b></td>' +
          '<td class="num" data-sys>' + x.qty + '</td>' +
          '<td><input class="input" type="number" data-real value="' + x.qty + '" style="width:90px"></td>' +
          '<td><input class="input" data-reason placeholder="Farq sababi"></td></tr>').join('') +
        '</tbody></table></div>',
      footer: '<button class="btn" data-mclose>Bekor qilish</button><button class="btn btn-warn" data-save>💾 Inventarizatsiyani saqlash</button>'
    });
    m.q('[data-save]').onclick = async () => {
      const changes = [];
      m.qa('[data-irow]').forEach(r => {
        const sys = parseInt(r.querySelector('[data-sys]').textContent, 10);
        const real = parseInt(r.querySelector('[data-real]').value, 10);
        if (!isNaN(real) && real !== sys) changes.push({ id: r.dataset.id, real, reason: r.querySelector('[data-reason]').value.trim() });
      });
      if (!changes.length) { GC.toast('Farq topilmadi — hammasi to‘g‘ri 👍', 'ok'); m.close(); return; }
      const ok = await GC.confirm({
        title: 'Inventarizatsiyani tasdiqlang', okText: 'Tasdiqlash',
        html: changes.length + ' ta mahsulotda farq aniqlandi. Ombor qoldig‘i tuzatiladi.'
      });
      if (!ok) return;
      changes.forEach(c => GC.inventoryAdjust(c.id, c.real, c.reason));
      m.close(); GC.toast('✅ Inventarizatsiya saqlandi: ' + changes.length + ' ta tuzatish', 'ok');
    };
  };
  A['purchase-cancel'] = async (el) => {
    const p = GC.state.purchases.find(x => x.id === el.dataset.id); if (!p) return;
    const reason = await GC.confirm({
      title: 'Kirimni bekor qilish', danger: true, okText: 'Bekor qilish', reason: true,
      html: '<b>' + money(p.total) + '</b> summadagi kirim bekor qilinsinmi? Ombor qoldig‘i kamayadi.'
    });
    if (!reason) return;
    GC.cancelPurchase(p.id, reason === true ? '' : reason);
    GC.toast('Kirim bekor qilindi', 'ok');
  };

  /* --- Yetkazib beruvchilar --- */
  function supplierForm(s) {
    return '<div class="field"><label>Nomi *</label><input class="input" name="name" value="' + esc(s ? s.name : '') + '" data-autofocus><div class="err"></div></div>' +
      '<div class="grid2"><div class="field"><label>Telefon</label><input class="input" name="phone" value="' + esc(s ? s.phone : '') + '"><div class="err"></div></div>' +
      '<div class="field"><label>Manzil</label><input class="input" name="address" value="' + esc(s ? s.address : '') + '"></div></div>' +
      '<div class="field"><label>Izoh</label><input class="input" name="note" value="' + esc(s ? s.note : '') + '"></div>';
  }
  A['new-supplier'] = () => {
    const m = GC.modal({
      title: '🚚 Yangi yetkazib beruvchi', body: supplierForm(null),
      footer: '<button class="btn" data-mclose>Bekor qilish</button><button class="btn btn-primary" data-save>Saqlash</button>'
    });
    m.q('[data-save]').onclick = () => {
      const v = m.values(); const e = {};
      if (!String(v.name || '').trim()) e.name = 'Nomini kiriting';
      if (v.phone && !GC.validPhone(v.phone)) e.phone = 'Telefon raqami noto‘g‘ri';
      if (!GC.showErrors(m.el, e)) return;
      GC.addSupplier(v); m.close(); GC.toast('Yetkazib beruvchi qo‘shildi', 'ok');
    };
  };
  A['sup-edit'] = (el) => {
    const s = GC.state.suppliers.find(x => x.id === el.dataset.id); if (!s) return;
    const m = GC.modal({
      title: '✏️ Tahrirlash', body: supplierForm(s),
      footer: '<button class="btn" data-mclose>Bekor qilish</button><button class="btn btn-primary" data-save>Saqlash</button>'
    });
    m.q('[data-save]').onclick = () => {
      const v = m.values(); const e = {};
      if (!String(v.name || '').trim()) e.name = 'Nomini kiriting';
      if (v.phone && !GC.validPhone(v.phone)) e.phone = 'Telefon raqami noto‘g‘ri';
      if (!GC.showErrors(m.el, e)) return;
      GC.updateSupplier(s.id, v); m.close(); GC.toast('Yangilandi', 'ok');
    };
  };
  A['sup-delete'] = async (el) => {
    const ok = await GC.confirm({ title: 'O‘chirish', danger: true, okText: 'O‘chirish', text: 'Yetkazib beruvchi o‘chirilsinmi?' });
    if (!ok) return;
    if (!GC.deleteSupplier(el.dataset.id)) GC.toast('Bunga bog‘langan mahsulot yoki kirim bor — o‘chirib bo‘lmaydi', 'err', 4500);
    else GC.toast('O‘chirildi', 'ok');
  };
})();

</script>
<script>
/* =========================================================================
   Qarz Daftar — KASSA, HISOBOTLAR, AUDIT, SOZLAMALAR (BACKUP)
   ========================================================================= */
(function () {
  'use strict';
  const GC = window.GC;
  const esc = GC.esc, money = GC.money, fmtDate = GC.fmtDate;
  const UI = GC.ui;
  UI.reports = { tab: 'day', custom: { from: GC.addDays(GC.todayISO(), -29), to: GC.todayISO() } };
  UI.audit = { q: '', page: 1, type: 'all' };
  UI.cash = { range: 'today', custom: { from: '', to: '' } };

  /* =================== KASSA =================== */
  GC.views.cash = function () {
    const st = GC.compute(), f = UI.cash;
    const r = GC.rangeFor(f.range, f.custom);
    const rows = st.cashRows.filter(x => GC.inRange(x.date, r)).sort((a, b) => (a.date < b.date ? 1 : -1));
    const total = rows.reduce((s, x) => s + x.amount, 0);
    const byM = {};
    GC.PAY_METHODS.forEach(m => byM[m.id] = rows.filter(x => x.method === m.id).reduce((s, x) => s + x.amount, 0));
    const fromSales = rows.filter(x => x.src === 'sotuv').reduce((s, x) => s + x.amount, 0);
    const fromDebts = rows.filter(x => x.src !== 'sotuv').reduce((s, x) => s + x.amount, 0);
    const chip = (val, label) => '<button class="chip' + (f.range === val ? ' active' : '') +
      '" data-action="cash-range" data-val="' + val + '">' + esc(label) + '</button>';

    return '<div class="page-head"><div><div class="page-title">Kassa</div>' +
      '<div class="page-sub">' + r.label + ' · Jami tushum: <b>' + money(total) + '</b></div></div><div class="spacer"></div>' +
      GC.exportBar('cash') + '</div>' +
      '<div class="chips" style="margin-bottom:14px">' + chip('today', 'Bugun') + chip('yesterday', 'Kecha') +
      chip('week', 'Shu hafta') + chip('month', 'Shu oy') + chip('all', 'Barcha vaqt') + '</div>' +
      '<div class="cards">' +
      GC.statCard('Jami kassa tushumi', money(total), r.label, 'ok', '🏦') +
      GC.statCard('Magazin sotuvidan', money(fromSales), 'Naqd va boshqa to‘lovlar', '', '🛒') +
      GC.statCard('Qarz to‘lovlaridan', money(fromDebts), 'Mijozlar qaytargan', 'info', '💵') +
      GC.PAY_METHODS.map(m => GC.statCard(m.name, money(byM[m.id]), '', '', '💳')).join('') +
      '</div>' +
      '<div class="panel"><div class="panel-head"><div class="panel-title">Kassa harakatlari</div></div>' +
      '<div class="panel-body tight"><div class="table-wrap"><table class="tbl"><thead><tr>' +
      '<th>Sana</th><th>Manba</th><th>To‘lov turi</th><th class="num">Summa</th></tr></thead><tbody>' +
      (rows.length ? rows.slice(0, 300).map(x => '<tr><td class="mono">' + fmtDate(x.date) + '</td>' +
        '<td>' + (x.src === 'sotuv' ? '🛒 Magazin sotuvi' : '💵 Qarz to‘lovi') + '</td>' +
        '<td><span class="badge b-blue">' + esc(GC.methodName(x.method)) + '</span></td>' +
        '<td class="num strong" style="color:var(--ok)">+' + money(x.amount) + '</td></tr>').join('')
        : '<tr><td colspan="4"><div class="empty">Kassa harakatlari yo‘q</div></td></tr>') +

  /* =================== HISOBOTLAR =================== */
  function periodStats(from, to) {
    const S = GC.state;
    const inR = (d) => (!from || d >= from) && (!to || d <= to);
    const debts = S.debts.filter(d => !d.canceled && inR(d.date));
    const pays = S.payments.filter(p => !p.canceled && inR(p.date));
    const sales = S.sales.filter(s => !s.canceled && inR(s.date));
    const purch = S.purchases.filter(p => !p.canceled && inR(p.date));
    const newCust = S.customers.filter(c => inR(c.date || GC.dateToISO(new Date(c.createdAt || Date.now()))));
    const st = GC.compute();
    const closed = st.debtRows.filter(r => r.status === 'paid' && inR(r.d.date)).length;
    return {
      debtSum: debts.reduce((s, d) => s + d.amount, 0), debtCount: debts.length,
      paySum: pays.reduce((s, p) => s + p.amount, 0), payCount: pays.length,
      saleSum: sales.reduce((s, x) => s + x.total, 0), saleProfit: sales.reduce((s, x) => s + (x.total - x.cost), 0),
      saleCount: sales.length, purchaseSum: purch.reduce((s, p) => s + p.total, 0),
      debtors: new Set(debts.map(d => d.customerId)).size,
      newCustomers: newCust.length, closedDebts: closed
    };
  }

  GC.views.reports = function () {
    const S = GC.state, st = GC.compute(), f = UI.reports;
    const today = st.today;
    const tabs = [['day', 'Kunlik'], ['week', 'Haftalik'], ['month', 'Oylik'], ['custom', 'Tanlangan davr']];
    let from, to, label, series = [];

    if (f.tab === 'day') {
      from = today; to = today; label = 'Bugun · ' + fmtDate(today);
      for (let i = 13; i >= 0; i--) {
        const iso = GC.addDays(today, -i), d = GC.isoToDate(iso);
        series.push({ iso, label: d.getDate() + '.' + (d.getMonth() + 1) });
      }
    } else if (f.tab === 'week') {
      const r = GC.rangeFor('week'); from = r.from; to = r.to; label = 'Shu hafta · ' + fmtDate(from) + ' — ' + fmtDate(to);
      for (let i = 6; i >= 0; i--) {
        const iso = GC.addDays(today, -i), d = GC.isoToDate(iso);
        series.push({ iso, label: GC.WEEK[d.getDay()].slice(0, 3) });
      }
    } else if (f.tab === 'month') {
      const r = GC.rangeFor('month'); from = r.from; to = r.to; label = 'Shu oy · ' + GC.MONTHS[GC.isoToDate(today).getMonth()];
      const days = GC.isoToDate(today).getDate();
      for (let i = days - 1; i >= 0; i--) {
        const iso = GC.addDays(today, -i), d = GC.isoToDate(iso);
        series.push({ iso, label: String(d.getDate()) });
      }
    } else {
      from = f.custom.from; to = f.custom.to; label = fmtDate(from) + ' — ' + fmtDate(to);
      let cur = from, guard = 0;
      while (cur <= to && guard++ < 120) {
        const d = GC.isoToDate(cur);
        series.push({ iso: cur, label: d.getDate() + '.' + (d.getMonth() + 1) });
        cur = GC.addDays(cur, 1);
      }
    }

    const P = periodStats(from, to);
    const chartData = series.map(s => ({
      label: s.label,
      a: S.debts.filter(d => !d.canceled && d.date === s.iso).reduce((x, d) => x + d.amount, 0),
      b: S.payments.filter(p => !p.canceled && p.date === s.iso).reduce((x, p) => x + p.amount, 0)
    }));
    const salesLine = series.map(s => ({
      label: s.label,
      v: S.sales.filter(x => !x.canceled && x.date === s.iso).reduce((a, b) => a + b.total, 0)
    }));

    // TOP ro'yxatlar
    const topDebtors = st.customers.filter(c => c.remain > 0).sort((a, b) => b.remain - a.remain).slice(0, 10);
    const saleItems = S.sale_items.filter(i => {
      const s = S.sales.find(x => x.id === i.saleId);
      return s && !s.canceled && (!from || s.date >= from) && (!to || s.date <= to);
    });
    const byProd = {};
    saleItems.forEach(i => {
      byProd[i.productId] = byProd[i.productId] || { name: i.name, qty: 0, sum: 0, profit: 0 };
      byProd[i.productId].qty += i.qty;
      byProd[i.productId].sum += i.qty * i.price;
      byProd[i.productId].profit += (i.price - i.cost) * i.qty;
    });
    const prodList = Object.values(byProd);
    const topQty = prodList.slice().sort((a, b) => b.qty - a.qty).slice(0, 8);
    const topProfit = prodList.slice().sort((a, b) => b.profit - a.profit).slice(0, 8);

    return '<div class="page-head"><div><div class="page-title">Hisobotlar</div><div class="page-sub">' + esc(label) + '</div></div>' +
      '<div class="spacer"></div>' + GC.exportBar('report') + '</div>' +
      '<div class="chips" style="margin-bottom:14px">' +
      tabs.map(t => '<button class="chip' + (f.tab === t[0] ? ' active' : '') + '" data-action="rep-tab" data-val="' + t[0] + '">' + t[1] + '</button>').join('') +
      '</div>' +
      (f.tab === 'custom' ? '<div class="panel"><div class="panel-head"><div class="row"><span class="muted">Dan:</span>' +
        '<input type="date" class="input" style="width:auto" data-action="rep-date" data-k="from" value="' + esc(f.custom.from) + '">' +
        '<span class="muted">Gacha:</span><input type="date" class="input" style="width:auto" data-action="rep-date" data-k="to" value="' + esc(f.custom.to) + '"></div></div></div>' : '') +

      '<div class="cards">' +
      GC.statCard('Berilgan qarz', money(P.debtSum), P.debtCount + ' ta yozuv', 'dan', '📤') +
      GC.statCard('Qaytarilgan qarz', money(P.paySum), P.payCount + ' ta to‘lov', 'ok', '📥') +
      GC.statCard('Davr farqi', money(P.debtSum - P.paySum), P.debtSum >= P.paySum ? 'Qarz o‘sdi' : 'Qarz kamaydi', P.debtSum >= P.paySum ? 'warn' : 'ok', '⚖️') +
      GC.statCard('Qarzdorlar', P.debtors + ' ta', 'Davrda qarz olganlar', 'info', '👥') +
      GC.statCard('Yangi mijozlar', P.newCustomers + ' ta', '', '', '🆕') +
      GC.statCard('Yopilgan qarzlar', P.closedDebts + ' ta', 'To‘liq to‘langan', 'ok', '🏁') +
      GC.statCard('Magazin savdosi', money(P.saleSum), P.saleCount + ' ta chek', 'info', '🛒') +
      GC.statCard('Magazin foydasi', money(P.saleProfit), 'Sof foyda', 'ok', '💹') +
      GC.statCard('Omborga kirim', money(P.purchaseSum), 'Sotib olingan mahsulot', 'warn', '📦') +
      GC.statCard('Umumiy qoldiq qarz', money(st.totals.remain), 'Hozirgi holat', 'dan', '📕') +
      '</div>' +

      '<div class="grid2">' +
      '<div class="panel"><div class="panel-head"><div class="panel-title">📊 Qarz va to‘lovlar dinamikasi</div></div>' +
      '<div class="panel-body">' + GC.chart.bars(chartData) + '</div>' +
      '<div class="chart-legend"><span><i style="background:#ef4444"></i>Berilgan qarz</span><span><i style="background:#22c55e"></i>Qaytarilgan</span></div></div>' +
      '<div class="panel"><div class="panel-head"><div class="panel-title">📈 Magazin savdosi</div></div>' +
      '<div class="panel-body">' + GC.chart.line(salesLine) + '</div></div>' +
      '</div>' +

      '<div class="grid2">' +
      '<div class="panel"><div class="panel-head"><div class="panel-title">🏆 TOP qarzdorlar</div></div><div class="panel-body">' +
      (topDebtors.length ? GC.chart.hbars(topDebtors.map(c => ({ label: c.c.name, value: c.remain })))
        : '<div class="empty">Qarzdorlar yo‘q</div>') + '</div></div>' +
      '<div class="panel"><div class="panel-head"><div class="panel-title">🔥 Eng ko‘p sotilgan mahsulotlar</div></div><div class="panel-body">' +
      (topQty.length ? GC.chart.hbars(topQty.map(p => ({ label: p.name, value: p.qty, display: p.qty + ' dona' })))
        : '<div class="empty">Sotuvlar yo‘q</div>') + '</div></div>' +
      '</div>' +

      '<div class="panel"><div class="panel-head"><div class="panel-title">💰 Eng ko‘p foyda keltirgan mahsulotlar</div></div>' +
      '<div class="panel-body">' + (topProfit.length ? GC.chart.hbars(topProfit.map(p => ({ label: p.name, value: p.profit })))
        : '<div class="empty">Ma’lumot yo‘q</div>') + '</div></div>';
  };

    GC.save(); GC.toast('Faol kassir: ' + el.dataset.name, 'ok');
  };
  A['del-cashier'] = (el) => {
    const S = GC.state;
    S.settings.cashiers = (S.settings.cashiers || []).filter(c => c !== el.dataset.name);
    GC.audit('settings', 'system', null, 'Kassir o‘chirildi: ' + el.dataset.name);
    GC.save();
  };
  A['open-cashier'] = () => { location.hash = '#/settings'; };
  A['goto-backup'] = () => { location.hash = '#/settings'; };

  /* --- Backup amallari --- */
  A['pick-folder'] = () => GC.Backup.chooseFolder().then(() => GC.rerender());
  A['restore-perm'] = () => GC.Backup.restorePermission().then(() => GC.rerender());
  A['backup-now'] = () => GC.Backup.run('manual').then(() => GC.rerender());
  A['backup-check'] = () => GC.Backup.check().then(() => GC.rerender());

  async function applyRestore(obj, sourceLabel) {
    const v = GC.validateBackup(obj);
    if (!v.ok) { GC.toast('🔴 Backup yaroqsiz: ' + v.reason, 'err', 6000); return; }
    const ok = await GC.confirm({
      title: '⚠️ Diqqat!', danger: true, okText: 'Davom etish',
      html: '<b>Backupdan tiklash joriy ma’lumotlarni almashtiradi.</b><br><br>' +
        'Manba: ' + esc(sourceLabel) + '<br>' +
        'Mijozlar: <b>' + v.stats.customers + '</b> · Qarzlar: <b>' + v.stats.debts + '</b> · To‘lovlar: <b>' + v.stats.payments + '</b><br>' +
        'Mahsulotlar: <b>' + v.stats.products + '</b> · Sotuvlar: <b>' + v.stats.sales + '</b><br>' +
        (v.stats.exportedAt ? 'Yaratilgan: ' + GC.fmtDT(v.stats.exportedAt) + '<br>' : '') +
        '<br><span class="muted">Tiklashdan oldin joriy baza avtomatik zaxiraga olinadi.</span>'
    });
    if (!ok) return;
    await GC.Backup.safetyBackup();
    GC.importJSON(obj);
    GC.Backup.schedule();
    GC.rerender();
    GC.toast('✅ Ma’lumotlar backupdan tiklandi', 'ok', 5000);
  }

  A['backup-restore'] = async () => {
    const B = GC.Backup.status;
    const fileInput = () => {
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = '.db,.json,application/json';
      inp.onchange = () => {
        const f = inp.files[0]; if (!f) return;
        const rd = new FileReader();
        rd.onload = () => {
          try { applyRestore(JSON.parse(rd.result), f.name); }
          catch (e) { GC.toast('🔴 Fayl o‘qilmadi yoki buzilgan', 'err', 5000); }
        };
        rd.readAsText(f);
      };
      inp.click();
    };
    if (B.connected) {
      const m = GC.modal({
        title: '♻️ Backupdan tiklash',
        body: '<div class="confirm-text">Qaysi manbadan tiklaymiz?</div>',
        footer: '<button class="btn" data-file>📂 Fayl tanlash</button>' +
          '<button class="btn btn-primary" data-main>💾 ' + GC.Backup.FILE_MAIN + '</button>' +
          '<button class="btn" data-mclose>Bekor</button>'
      });
      m.q('[data-file]').onclick = () => { m.close(); fileInput(); };
      m.q('[data-main]').onclick = async () => {
        m.close();
        const r = await GC.Backup.readMainBackup();
        if (!r) { GC.toast('🔴 Backup fayli topilmadi', 'err'); return; }
        try { applyRestore(JSON.parse(r.text), GC.Backup.FILE_MAIN + ' (' + GC.fmtSize(r.size) + ')'); }
        catch (e) { GC.toast('🔴 Backup fayli buzilgan', 'err'); }
      };
    } else fileInput();
  };

  A['export-db'] = () => {
    GC.download('GameClub_Export_' + GC.todayISO() + '.db', GC.exportJSON(), 'application/json');
    GC.toast('Ma’lumotlar eksport qilindi', 'ok');
  };
  A['import-db'] = () => A['backup-restore']();
  A['reset-db'] = async () => {
    const ok = await GC.confirm({
      title: '🧨 Bazani tozalash', danger: true, okText: 'Hammasini o‘chirish',
      html: '<b>Barcha mijozlar, qarzlar, to‘lovlar, mahsulotlar va sotuvlar o‘chiriladi!</b><br>' +
        '<span class="muted">Avval joriy baza zaxiraga olinadi. Bu amalni qaytarib bo‘lmaydi.</span>'
    });
    if (!ok) return;
    await GC.Backup.safetyBackup();
    const settings = GC.state.settings;
    const fresh = GC.defaultState();
    fresh.settings = settings;
    GC.setState(fresh);
    GC.audit('delete', 'system', null, 'Baza to‘liq tozalandi');
    GC.save();
    GC.toast('Baza tozalandi (zaxira nusxa saqlandi)', 'ok');
  };
})();

</script>
<script>
/* =========================================================================
   Qarz Daftar — ILOVA YADROSI (router, global qidiruv, hodisalar)
   ========================================================================= */
(function () {
  'use strict';
  const GC = window.GC;
  const esc = GC.esc, money = GC.money;

  const ROUTES = ['dashboard', 'debts', 'customers', 'payments', 'pos', 'sales', 'products', 'stock', 'suppliers', 'cash', 'reports', 'audit', 'settings'];
  let current = 'dashboard';
  let rafPending = false;

  /* ---------------- Render ---------------- */
  function currentRoute() {
    const h = (location.hash || '').replace(/^#\/?/, '').split('?')[0];
    return ROUTES.includes(h) ? h : 'dashboard';
  }

  function render(keepFocus) {
    const view = document.getElementById('view');
    const name = current;
    const fn = GC.views[name];
    let focusSel = null, selStart = null;
    if (keepFocus && document.activeElement && document.activeElement.dataset && document.activeElement.dataset.action) {
      focusSel = '[data-action="' + document.activeElement.dataset.action + '"]';
      selStart = document.activeElement.selectionStart;
    }
    try {
      view.innerHTML = fn ? fn() : '<div class="empty">Sahifa topilmadi</div>';
    } catch (e) {
      console.error(e);
      view.innerHTML = '<div class="empty"><div class="big">⚠️</div>Sahifani chizishda xato: ' + esc(e.message) + '</div>';
    }
    GC.initMoneyInputs(view);
    document.querySelectorAll('.nav-item').forEach(a => a.classList.toggle('active', a.dataset.view === name));
    updateChrome();
    if (focusSel) {
      const el = view.querySelector(focusSel);
      if (el) { el.focus(); try { el.setSelectionRange(selStart, selStart); } catch (e) {} }
    }
  }

  GC.rerender = function (keepFocus) {
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(() => { rafPending = false; render(keepFocus); });
  };

  function updateChrome() {
    const S = GC.state, st = GC.compute(), B = GC.Backup.status;
    document.getElementById('brandName').textContent = S.settings.clubName || 'GAME CLUB';
    document.getElementById('cashierName').textContent = S.settings.cashier || 'Admin';
    document.getElementById('cashierAva').textContent = (S.settings.cashier || 'A').charAt(0).toUpperCase();
    const bd = document.getElementById('badgeDebts');
    bd.textContent = st.totals.overdueCount ? st.totals.overdueCount : '';
    const bs = document.getElementById('badgeStock');
    const lowOut = st.stock.low + st.stock.out;
    bs.textContent = lowOut ? lowOut : '';
    const dot = document.getElementById('backupDot');
    const txt = document.getElementById('backupChipText');
    dot.className = 'dot ' + (!B.connected ? '' : B.lastStatus === 'err' ? 'err' : B.lastStatus === 'ok' ? 'ok' : 'warn');
    txt.textContent = !B.supported ? 'Backup: mavjud emas'
      : !B.connected ? 'Backup: papka tanlanmagan'
      : B.lastStatus === 'err' ? 'Backup: xato!'
      : B.lastAt ? 'Backup: ' + GC.fmtTime(B.lastAt) : 'Backup: tayyor';
    document.getElementById('themeBtn').textContent = S.settings.theme === 'dark' ? '🌙' : '☀️';
  }
  GC.on('backup', () => { try { updateChrome(); } catch (e) {} });

  /* ---------------- Router ---------------- */
  function route() {
    current = currentRoute();
    document.body.classList.remove('nav-open');
    render();
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);

  /* ---------------- Hodisalar ---------------- */
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const act = el.dataset.action;
    if (el.tagName === 'INPUT' && (el.type === 'checkbox' || el.type === 'radio')) {
      // checkbox amallari o'z handlerida
    } else if (el.tagName === 'INPUT' || el.tagName === 'SELECT' || el.tagName === 'TEXTAREA') return;
    const fn = GC.actions[act];
    if (fn) { e.preventDefault(); fn(el, e); }
  });
  document.addEventListener('change', (e) => {
    const el = e.target.closest('[data-action],[data-set]');
    if (!el) return;
    if (el.dataset.set) { GC.settingsInput(el); return; }
    const act = el.dataset.action;
    if (el.type === 'checkbox' && GC.actions[act]) { GC.actions[act](el, e); return; }
    if (GC.inputHandlers[act]) GC.inputHandlers[act](el, e);
  });
  let inputTimer = null;
  document.addEventListener('input', (e) => {
    const el = e.target.closest('[data-action],[data-set],[name]');
    if (!el) return;
    if (el.dataset.set) { clearTimeout(inputTimer); inputTimer = setTimeout(() => GC.settingsInput(el), 400); return; }
    const act = el.dataset.action || el.name;
    if (act === 'globalSearch') return;
    if (GC.inputHandlers[act]) {
      clearTimeout(inputTimer);
      inputTimer = setTimeout(() => GC.inputHandlers[act](el, e), el.type === 'date' ? 0 : 220);
    }
  });

  /* ---------------- Sidebar / tema ---------------- */
  GC.actions['toggle-sidebar'] = () => document.body.classList.toggle('nav-open');
  GC.actions['toggle-theme'] = () => {
    const S = GC.state;
    S.settings.theme = S.settings.theme === 'dark' ? 'light' : 'dark';
    applyTheme();
    GC.save();
  };
  function applyTheme() {
    document.documentElement.setAttribute('data-theme', GC.state.settings.theme === 'light' ? 'light' : 'dark');
    const meta = document.querySelector('meta[name=theme-color]');
    if (meta) meta.content = GC.state.settings.theme === 'light' ? '#eef2f9' : '#0b0f1a';
  }

  /* ---------------- Global qidiruv ---------------- */
  const searchEl = document.getElementById('globalSearch');
  const resEl = document.getElementById('searchResults');
  let searchTimer = null;

  function globalSearch(q) {
    q = q.trim().toLowerCase();
    if (!q) { resEl.hidden = true; return; }
    const st = GC.compute(), S = GC.state;
    const num = GC.parseMoney(q);
    const out = [];

    const custs = st.customers.filter(x =>
      x.c.name.toLowerCase().includes(q) || (x.c.phone || '').includes(q.replace(/\D/g, '')) ||
      (x.c.telegram || '').toLowerCase().includes(q) || x.id.toLowerCase().includes(q)).slice(0, 6);
    if (custs.length) out.push('<div class="sr-group">Mijozlar</div>' + custs.map(x =>
      '<div class="sr-item" data-action="customer-view" data-id="' + x.id + '"><span>' + GC.esc(x.c.name) +
      ' <span class="muted">' + GC.esc(GC.fmtPhone(x.c.phone)) + '</span></span>' +
      '<b style="color:' + (x.remain > 0 ? 'var(--dan)' : 'var(--ok)') + '">' + money(x.remain) + '</b></div>').join(''));

    const debts = st.debtRows.filter(r =>
      (r.customer && r.customer.c.name.toLowerCase().includes(q)) ||
      (r.d.reason || '').toLowerCase().includes(q) || r.d.id.toLowerCase().includes(q) ||
      (!isNaN(num) && String(r.d.amount).startsWith(String(num))) || r.d.date === q).slice(0, 6);
    if (debts.length) out.push('<div class="sr-group">Qarzlar</div>' + debts.map(r =>
      '<div class="sr-item" data-action="debt-view" data-id="' + r.d.id + '"><span>' +
      GC.esc(r.customer ? r.customer.c.name : '—') + ' <span class="muted">' + GC.fmtDate(r.d.date) + '</span></span>' +
      '<b>' + money(r.remain) + '</b></div>').join(''));

    const prods = st.products.filter(x => x.p.name.toLowerCase().includes(q) || (x.p.barcode || '').includes(q)).slice(0, 6);
    if (prods.length) out.push('<div class="sr-group">Mahsulotlar</div>' + prods.map(x =>
      '<div class="sr-item" data-action="prod-history" data-id="' + x.p.id + '"><span>' + GC.esc(x.p.name) +
      ' <span class="muted">' + x.qty + ' ' + GC.esc(x.p.unit) + '</span></span><b>' + money(x.p.salePrice) + '</b></div>').join(''));

    const pays = S.payments.filter(p => !p.canceled && (!isNaN(num) && String(p.amount).startsWith(String(num)) || p.date === q)).slice(0, 4);
    if (pays.length) out.push('<div class="sr-group">To‘lovlar</div>' + pays.map(p => {
      const c = st.custById.get(p.customerId);
      return '<div class="sr-item" data-action="pay-receipt" data-id="' + p.id + '"><span>' + GC.esc(c ? c.c.name : '—') +
        ' <span class="muted">' + GC.fmtDate(p.date) + '</span></span><b style="color:var(--ok)">' + money(p.amount) + '</b></div>';
    }).join(''));

    resEl.innerHTML = out.length ? out.join('') : '<div class="sr-group">Hech narsa topilmadi</div>';
    resEl.hidden = false;
  }
  searchEl.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => globalSearch(searchEl.value), 160);
  });
  searchEl.addEventListener('focus', () => { if (searchEl.value) globalSearch(searchEl.value); });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.search-wrap')) resEl.hidden = true;
    else if (e.target.closest('.sr-item')) { resEl.hidden = true; searchEl.value = ''; }
  });

  /* ---------------- Klaviatura ---------------- */
  document.addEventListener('keydown', (e) => {
    if (e.target.matches('input,textarea,select')) {
      if (e.key === 'Escape') e.target.blur();
      return;
    }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === 'q') { e.preventDefault(); GC.actions['new-debt']({ dataset: {} }); }
    else if (k === 't') { e.preventDefault(); GC.actions['new-payment']({ dataset: {} }); }
    else if (k === 'm') { e.preventDefault(); location.hash = '#/pos'; }
    else if (k === '/') { e.preventDefault(); searchEl.focus(); }
  });

  /* ---------------- Eksport ---------------- */
  GC.actions['export'] = (el) => {
    const kind = el.dataset.kind, what = el.dataset.what;
    const S = GC.state, st = GC.compute();
    const M = (n) => GC.groupNum(n);
    let rows = [], headers = [], name = '';

    if (what === 'debts') {
      name = 'Qarzlar_' + GC.todayISO();
      rows = st.debtRows;
      headers = [
        { label: 'ID', get: r => r.d.id.slice(-6).toUpperCase() },
        { label: 'Mijoz', get: r => r.customer ? r.customer.c.name : '' },
        { label: 'Telefon', get: r => r.customer ? GC.fmtPhone(r.customer.c.phone) : '' },
        { label: 'Qarz', get: r => M(r.d.amount) }, { label: 'To‘langan', get: r => M(r.paid) },
        { label: 'Qolgan', get: r => M(r.remain) }, { label: 'Sana', get: r => GC.fmtDate(r.d.date) },
        { label: 'Muddat', get: r => r.d.dueDate ? GC.fmtDate(r.d.dueDate) : '' },
        { label: 'Holat', get: r => ({ paid: 'To‘langan', open: 'To‘lanmagan', partial: 'Qisman', due_today: 'Bugun to‘lanadi', overdue: 'Muddati o‘tgan' })[r.status] },
        { label: 'Sabab', get: r => r.d.reason || '' }, { label: 'Kassir', get: r => r.d.cashier || '' }];
    } else if (what === 'customers') {
      name = 'Mijozlar_' + GC.todayISO();
      rows = st.customers;
      headers = [
        { label: 'Ism', get: r => r.c.name }, { label: 'Telefon', get: r => GC.fmtPhone(r.c.phone) },
        { label: 'Telegram', get: r => r.c.telegram || '' }, { label: 'Jami qarz', get: r => M(r.total) },
        { label: 'To‘langan', get: r => M(r.paid) }, { label: 'Qolgan', get: r => M(r.remain) },
        { label: 'Muddati o‘tgan', get: r => M(r.overdue) },
        { label: 'Oxirgi qarz', get: r => r.lastDebt ? GC.fmtDate(r.lastDebt) : '' },
        { label: 'Oxirgi to‘lov', get: r => r.lastPay ? GC.fmtDate(r.lastPay) : '' },
        { label: 'Holat', get: r => ({ clear: 'Qarzi yo‘q', debt: 'Qarz mavjud', overdue: 'Muddati o‘tgan' })[r.status] }];
    } else if (what === 'payments') {
      name = 'Tolovlar_' + GC.todayISO();
      rows = S.payments.filter(p => !p.canceled);
      headers = [
        { label: 'Sana', get: p => GC.fmtDate(p.date) },
        { label: 'Mijoz', get: p => { const c = st.custById.get(p.customerId); return c ? c.c.name : ''; } },
        { label: 'Summa', get: p => M(p.amount) }, { label: 'Turi', get: p => GC.methodName(p.method) },
        { label: 'Izoh', get: p => p.note || '' }, { label: 'Kassir', get: p => p.cashier || '' }];
    } else if (what === 'sales') {
      name = 'Sotuvlar_' + GC.todayISO();
      rows = S.sales.filter(s => !s.canceled);
      headers = [
        { label: 'Sana', get: s => GC.fmtDate(s.date) },
        { label: 'Mahsulotlar', get: s => S.sale_items.filter(i => i.saleId === s.id).map(i => i.name + '×' + i.qty).join(', ') },
        { label: 'Jami', get: s => M(s.total) }, { label: 'Tannarx', get: s => M(s.cost) },
        { label: 'Foyda', get: s => M(s.total - s.cost) }, { label: 'To‘lov', get: s => GC.methodName(s.method) },
        { label: 'Mijoz', get: s => { const c = s.customerId ? st.custById.get(s.customerId) : null; return c ? c.c.name : ''; } },
        { label: 'Kassir', get: s => s.cashier || '' }];
    } else if (what === 'products') {
      name = 'Mahsulotlar_' + GC.todayISO();
      rows = st.products;
      headers = [
        { label: 'Nomi', get: x => x.p.name },
        { label: 'Kategoriya', get: x => { const c = S.categories.find(y => y.id === x.p.categoryId); return c ? c.name : ''; } },
        { label: 'Tannarx', get: x => M(x.p.costPrice) }, { label: 'Sotish narxi', get: x => M(x.p.salePrice) },
        { label: 'Qoldiq', get: x => x.qty }, { label: 'Birlik', get: x => x.p.unit },
        { label: 'Minimal', get: x => x.p.minStock || 0 },
        { label: 'Ombor qiymati', get: x => M(x.costValue) },
        { label: 'Holat', get: x => ({ ok: 'Mavjud', low: 'Kam qolgan', out: 'Tugagan' })[x.status] }];
    } else if (what === 'cash') {
      name = 'Kassa_' + GC.todayISO();
      const r = GC.rangeFor(GC.ui.cash.range, GC.ui.cash.custom);
      rows = st.cashRows.filter(x => GC.inRange(x.date, r));
      headers = [{ label: 'Sana', get: x => GC.fmtDate(x.date) }, { label: 'Manba', get: x => x.src },
        { label: 'To‘lov turi', get: x => GC.methodName(x.method) }, { label: 'Summa', get: x => M(x.amount) }];
    } else if (what === 'audit') {
      name = 'Audit_' + GC.todayISO();
      rows = S.audit_logs.slice().reverse();
      headers = [{ label: 'Vaqt', get: a => GC.fmtDT(a.ts) }, { label: 'Amal', get: a => a.action },
        { label: 'Obyekt', get: a => a.entity }, { label: 'Tavsif', get: a => a.description },
        { label: 'Foydalanuvchi', get: a => a.user || '' }];
    } else if (what === 'report') {
      name = 'Hisobot_' + GC.todayISO();
      rows = st.customers.filter(c => c.total > 0);
      headers = [{ label: 'Mijoz', get: c => c.c.name }, { label: 'Telefon', get: c => GC.fmtPhone(c.c.phone) },
        { label: 'Jami qarz', get: c => M(c.total) }, { label: 'To‘langan', get: c => M(c.paid) },
        { label: 'Qolgan', get: c => M(c.remain) }, { label: 'Muddati o‘tgan', get: c => M(c.overdue) }];
    }
    GC.exportTable(kind, name, rows, headers);
  };

  /* ---------------- Ishga tushirish ---------------- */
  function boot() {
    const existed = GC.load();
    applyTheme();
    if (!existed) {
      GC.audit('create', 'system', null, 'Dastur birinchi marta ishga tushirildi');
      GC.persist();
    }
    GC.Backup.init().then(() => updateChrome());
    route();

    // Xush kelibsiz oynasi — faqat birinchi ishga tushirishda
    if (!existed) {
      setTimeout(() => {
        GC.modal({
          title: '🎮 Xush kelibsiz!',
          body: '<div class="confirm-text">' +
            '<b>Qarz Daftar</b> — Game Club uchun qarz, magazin, ombor va kassa boshqaruv tizimi.<br><br>' +
            'Ishni boshlash uchun:<br>' +
            '1️⃣ <b>Sozlamalar</b> → klub nomini kiriting va <b>backup papkasini tanlang</b> (ma’lumot yo‘qolmasligi uchun)<br>' +
            '2️⃣ <b>Mijozlar</b> → mijozlarni qo‘shing<br>' +
            '3️⃣ <b>Qarzlar</b> → qarz yozing, to‘lov qabul qiling<br>' +
            '4️⃣ <b>Mahsulotlar</b> → magazin mahsulotlarini kiriting<br><br>' +
            '<span class="muted">Tezkor tugmalar: <b>Q</b> — qarz, <b>T</b> — to‘lov, <b>M</b> — magazin, <b>/</b> — qidiruv</span></div>',
          footer: '<button class="btn btn-primary" data-action="pick-folder" data-mclose>📁 Backup papkasini tanlash</button>' +
            '<button class="btn" data-mclose>Keyinroq</button>'
        });
      }, 400);
    }

    // PWA service worker (faqat http/https da ishlaydi)
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      /* standalone: service worker yo‘q */
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
</body>
</html>
