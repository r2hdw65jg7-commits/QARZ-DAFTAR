name: Windows uchun build (.exe)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Paketlarni o'rnatish
        run: npm install
      - name: Testlar
        run: npm test
      - name: Windows dasturini yig'ish
        run: npx electron-builder --win nsis portable --publish never
      - name: Natijani saqlash
        uses: actions/upload-artifact@v4
        with:
          name: qarz-daftar-windows
          path: |
            dist/*.exe
            dist/*.blockmap
      - name: Release'ga qo'shish
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
